<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kanareika</title>
<link rel="icon" type="image/png" href="/logo.png">
<style>

/* Tokens. One accent (canary), one cool-grey family, priority colors validated for CVD in both themes.
   Shape rule: controls 6, panels 10, chips and tags are pills. */
:root {
  --r-ctl: 6px; --r-panel: 10px; --r-pill: 999px;
  --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --ease: cubic-bezier(.23, 1, .32, 1);
}
:root, [data-theme="dark"] {
  /* the banner's world: blue-black, hairlines, canary accent, data in mono */
  --bg: #0b0d12; --surface: rgba(16,19,27,.82); --solid: #10131b; --raised: #161a24; --hover: rgba(255,255,255,.035); --sel: rgba(255,255,255,.06);
  --line: rgba(255,255,255,.07); --line-2: rgba(255,255,255,.12);
  --ink: #eceef5; --ink-2: #a3aabb; --ink-3: #6f778c;
  --accent: #ffd23f; --accent-ink: #0b0d12; --accent-line: #ffd23f;
  --host: #8fd8ff; --ok: #5fd4c4; --err: #ff5d6c;
  --p1: #ff5d6c; --p2: #ff9f43; --p3: #ffd23f; --p4: #7d8597;
  --shadow: 0 24px 64px rgba(0,0,0,.55);
  --aurora: radial-gradient(700px 420px at 100% 0%, rgba(130,100,255,.20), transparent 70%),
            radial-gradient(600px 380px at 100% 100%, rgba(255,190,60,.10), transparent 70%),
            radial-gradient(560px 340px at 0% 100%, rgba(60,200,190,.08), transparent 70%);
  --grid: rgba(160,175,210,.045);
  color-scheme: dark;
}
[data-theme="light"] {
  --bg: #f7f7f9; --surface: rgba(255,255,255,.9); --solid: #ffffff; --raised: #f1f2f6; --hover: rgba(11,13,18,.035); --sel: rgba(11,13,18,.06);
  --line: rgba(11,13,18,.08); --line-2: rgba(11,13,18,.14);
  --ink: #0b0d12; --ink-2: #4a5163; --ink-3: #6b7285;
  --accent: #ffd23f; --accent-ink: #0b0d12; --accent-line: #d9a800;
  --host: #0a6fa8; --ok: #13897a; --err: #d63a4a;
  --p1: #ff5d6c; --p2: #ff9f43; --p3: #ffd23f; --p4: #9aa1b2;
  --shadow: 0 24px 64px rgba(11,13,18,.14);
  --aurora: radial-gradient(700px 420px at 100% 0%, rgba(130,100,255,.10), transparent 70%),
            radial-gradient(600px 380px at 100% 100%, rgba(255,190,60,.10), transparent 70%);
  --grid: rgba(11,13,18,.035);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--aurora), var(--bg); background-attachment: fixed; color: var(--ink); font: 14px/1.45 var(--font); -webkit-font-smoothing: antialiased; overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent-line); outline-offset: 2px; }
code, .mono { font-family: var(--mono); font-size: 12.5px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: 240px minmax(0, 1fr); height: 100vh; }
.side { background-color: var(--solid); position: relative; isolation: isolate; border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.brand { display: flex; align-items: center; gap: 10px; padding: 16px 16px 12px; font-weight: 700; font-size: 17px; letter-spacing: -.03em; }
.brand img { filter: drop-shadow(0 4px 12px rgba(255,200,60,.35)); }
.brand kbd { margin-left: auto; }
.brand img { width: 22px; height: 22px; }
.scope { padding: 0 12px 12px; display: grid; gap: 8px; border-bottom: 1px solid var(--line); }
.orgbtn { display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 10px; background: var(--raised); border: 1px solid var(--line); border-radius: var(--r-ctl); text-align: left; }
.orgbtn b { font-weight: 600; } .orgbtn span { color: var(--ink-3); font-size: 12px; } .orgbtn svg { margin-left: auto; color: var(--ink-3); }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--raised); border: 1px solid var(--line); border-radius: var(--r-ctl); padding: 2px; }
.seg button { border: 0; background: none; padding: 5px 6px; border-radius: 4px; color: var(--ink-2); font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--line-2); }
.seg small { color: var(--ink-3); margin-left: 4px; }
nav.nav { padding: 10px 8px; display: grid; gap: 1px; overflow: auto; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: var(--r-ctl); color: var(--ink-2); text-decoration: none; position: relative; }
.nav a:hover { background: var(--hover); color: var(--ink); }
.nav a[aria-current="page"] { background: var(--hover); color: var(--ink); font-weight: 550; }
.nav a .n { margin-left: auto; font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.nav a .n.hot { color: var(--p1); font-weight: 600; }
.nav hr { border: 0; border-top: 1px solid var(--line); margin: 8px 2px; }
.status { margin-top: auto; padding: 12px; border-top: 1px solid var(--line); display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; font-size: 12.5px; } /* the side's width, not the longest line's */
.status .row { display: flex; align-items: center; gap: 8px; color: var(--ink-2); }
.status .row > span:last-child { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } /* one line in every language */
.status .row b { color: var(--ink); font-weight: 550; }
.status .dot { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex: none; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: var(--r-ctl); border: 1px solid var(--line-2); background: var(--raised); color: var(--ink); white-space: nowrap; transition: background .12s var(--ease); }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.05); }
.btn.ghost { background: none; border-color: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--hover); color: var(--ink); }
.btn.icon { width: 32px; padding: 0; }
.protostate { font-size: 11.5px; color: var(--ink-3); display: grid; gap: 4px; }
.protostate select { background: var(--raised); border: 1px dashed var(--line-2); border-radius: var(--r-ctl); padding: 3px 6px; font-size: 12px; }

main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.top { display: flex; align-items: center; gap: 12px; padding: 14px 24px 0; }
.top h1 { font-size: 20px; letter-spacing: -.015em; margin: 0; font-weight: 650; }
.top .sub { color: var(--ink-2); font-size: 13px; }
.top .tools { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.select { height: 32px; padding: 0 10px; border: 1px solid var(--line-2); background: var(--raised); border-radius: var(--r-ctl); }
.mbar { display: none; }
.scrim { display: none; }

/* ---------- ToDo ---------- */
.work { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 420px; }
.listcol { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.scroll { overflow: auto; min-height: 0; flex: 1; }
.rail { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; padding: 14px 24px 0; }
.pr { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-panel); padding: 10px 12px 8px; display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: end; transition: border-color .12s var(--ease), background .12s var(--ease); }
.pr:hover { border-color: var(--line-2); }
.pr[aria-pressed="true"] { border-color: var(--accent-line); background: var(--raised); }
.pr .lab { grid-column: 1 / -1; display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-2); }
.pr .lab i { width: 8px; height: 8px; border-radius: 2px; display: block; }
.pr .num { font-family: var(--mono); font-size: 26px; font-weight: 650; letter-spacing: -.02em; line-height: 1.1; font-variant-numeric: tabular-nums; }
.pr .due { grid-column: 1 / 2; font-size: 12px; color: var(--ink-3); }
.pr svg.spark { grid-row: 2 / 4; grid-column: 2; width: 84px; height: 30px; overflow: visible; }
.pr .zero { color: var(--ink-3); }
.toolbar { display: flex; gap: 8px; align-items: center; padding: 12px 24px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
.search { position: relative; flex: 0 1 280px; }
.search input { width: 100%; height: 32px; padding: 0 30px 0 32px; border-radius: var(--r-ctl); border: 1px solid var(--line-2); background: var(--surface); }
.search svg { position: absolute; left: 9px; top: 8px; color: var(--ink-3); }
.search kbd { position: absolute; right: 7px; top: 6px; }
kbd { font: 11px var(--mono); padding: 1px 5px; border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 4px; color: var(--ink-3); background: var(--surface); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { flex: none; white-space: nowrap; height: 28px; padding: 0 10px; border-radius: var(--r-pill); border: 1px solid var(--line-2); background: none; color: var(--ink-2); font-size: 12.5px; display: inline-flex; align-items: center; gap: 6px; }
.chip:hover { color: var(--ink); background: var(--hover); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip small { opacity: .7; font-variant-numeric: tabular-nums; }
.toolbar .right { margin-left: auto; display: flex; gap: 6px; align-items: center; color: var(--ink-3); font-size: 12.5px; }

.group { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 10px; padding: 14px 24px 6px; background: var(--bg); font-size: 12.5px; color: var(--ink-2); }
.group b { color: var(--ink); font-weight: 600; }
.group .gsel { margin-left: auto; }
.rows { list-style: none; margin: 0 16px; padding: 0; border: 1px solid var(--line); border-radius: var(--r-panel); background: var(--surface); overflow: hidden; }
.rowi { display: grid; grid-template-columns: 28px 30px minmax(0, 1fr) auto auto 64px; align-items: center; gap: 10px; padding: 0 12px 0 8px; min-height: 46px; border-top: 1px solid var(--line); cursor: pointer; position: relative; }
.rowi:first-child { border-top: 0; }
.rowi:hover { background: var(--hover); }
.rowi[aria-selected="true"] { background: var(--sel); }
.rowi.checked .cb { accent-color: var(--accent); }
.cb { width: 16px; height: 16px; accent-color: var(--accent); margin: 0 auto; cursor: pointer; }
.pb { display: inline-flex; align-items: center; justify-content: center; flex: none; align-self: center; box-sizing: border-box; height: 18px; min-width: 24px; width: 28px; padding: 0; font: 600 11px/18px var(--mono); text-align: center; border-radius: 4px; color: #0b0d12; vertical-align: middle; }
.pb.P1 { background: var(--p1); } .pb.P2 { background: var(--p2); } .pb.P3 { background: var(--p3); } .pb.P4 { background: var(--p4); }
.t { min-width: 0; display: flex; align-items: baseline; gap: 8px; }
.t .title { font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.t .where { color: var(--ink-3); font-size: 12px; font-family: var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: none; max-width: 45%; }
.tags { display: flex; gap: 4px; }
.tag { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: var(--r-pill); border: 1px solid currentColor; white-space: nowrap; }
.tag.rce { color: var(--p1); } .tag.kev { color: var(--p2); } .tag.reboot { color: var(--ink-3); }
.cve { color: var(--ink-2); font-size: 12.5px; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; min-width: 52px; }
.cve b { color: var(--ink); font-weight: 600; }
.duec { text-align: right; color: var(--ink-3); font-size: 12.5px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.end { height: 96px; }
.empty { margin: 32px 24px; padding: 32px; border: 1px dashed var(--line-2); border-radius: var(--r-panel); text-align: center; color: var(--ink-2); }
.empty h3 { margin: 0 0 4px; color: var(--ink); font-size: 15px; }

.selbar { position: sticky; bottom: 16px; margin: 0 16px; display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 16px; background: var(--raised); border: 1px solid var(--line-2); border-radius: var(--r-panel); box-shadow: var(--shadow); transform: translateY(12px); opacity: 0; pointer-events: none; transition: transform .2s var(--ease), opacity .2s var(--ease); z-index: 3; }
.selbar.on { transform: none; opacity: 1; pointer-events: auto; }
.selbar .what { font-size: 13px; } .selbar .what b { font-weight: 650; }
.selbar .what span { color: var(--ink-3); margin-left: 6px; }
.selbar .acts { margin-left: auto; display: flex; gap: 6px; }

/* detail */
.detail { border-left: 1px solid var(--line); background: var(--solid); overflow: auto; min-height: 0; }
.dh { padding: 20px 24px 16px; border-bottom: 1px solid var(--line); }
.dh .meta { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-2); }
.dh h2 { margin: 10px 0 8px; font-size: 18px; line-height: 1.3; letter-spacing: -.01em; font-weight: 650; }
.dh .hosts { display: flex; flex-wrap: wrap; gap: 6px; }
.hchip { font-family: var(--mono); color: var(--host); display: inline-flex; gap: 6px; align-items: center; padding: 3px 9px; border-radius: var(--r-pill); background: var(--raised); border: 1px solid var(--line); font-size: 12.5px; }
.hchip span { color: var(--ink-3); font-family: var(--font); }
.back { display: none; }
.sec { padding: 16px 24px; border-bottom: 1px solid var(--line); }
.sec h4 { margin: 0 0 10px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-3); }
.why { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.why li { display: flex; gap: 8px; align-items: flex-start; }
.why li svg { margin-top: 2px; color: var(--ink-3); }
.why li.hot svg { color: var(--p1); }
table.pk { width: 100%; border-collapse: collapse; font-size: 13px; }
.pk th { text-align: left; font-weight: 500; color: var(--ink-3); font-size: 12px; padding: 0 0 6px; }
.pk code { color: var(--ink); }
.pk td { padding: 7px 0; border-top: 1px solid var(--line); vertical-align: top; }
.pk td.r, .pk th.r { text-align: right; }
.pk .ver { color: var(--ink-2); font-family: var(--mono); font-size: 12.5px; }
.pk .ver b { color: var(--ink); font-weight: 500; }
.cves { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 10px; }
.cves a { color: var(--ink-2); font: 12px var(--mono); text-decoration: none; border-bottom: 1px dotted var(--line-2); }
.cves a:hover { color: var(--ink); }
.cmd { display: flex; align-items: flex-start; gap: 8px; background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-ctl); padding: 10px 8px 10px 12px; }
.cmd code { flex: 1; white-space: pre-wrap; word-break: break-word; line-height: 1.5; }
.cmd .btn { height: 26px; }
.dfoot { padding: 16px 24px 24px; display: flex; gap: 8px; flex-wrap: wrap; }
.nodetail { padding: 48px 24px; color: var(--ink-3); text-align: center; }

/* overview / hosts */
.page { padding: 16px 24px 48px; overflow: auto; flex: 1; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-panel); }
.panel > header { display: flex; align-items: center; gap: 10px; padding: 14px 16px 0; }
.panel > header h3 { margin: 0; font-size: 14px; font-weight: 600; }
.panel > header .hint { color: var(--ink-3); font-size: 12.5px; }
.panel > header .right { margin-left: auto; display: flex; gap: 6px; }
.legend { display: flex; gap: 12px; font-size: 12.5px; color: var(--ink-2); }
.legend button { background: none; border: 0; padding: 0; display: inline-flex; gap: 6px; align-items: center; color: inherit; }
.legend button[aria-pressed="false"] { opacity: .4; }
.legend i { width: 10px; height: 10px; border-radius: 2px; display: block; }
.chart { position: relative; padding: 8px 16px 12px; }
.chart svg { display: block; max-width: 100%; }
.chart .gl { stroke: var(--line); } .chart .ax { fill: var(--ink-3); font-size: 11px; font-family: var(--font); }
.tip { position: absolute; pointer-events: none; background: var(--raised); border: 1px solid var(--line-2); border-radius: var(--r-ctl); box-shadow: var(--shadow); padding: 8px 10px; font-size: 12.5px; min-width: 130px; display: none; z-index: 5; }
.tip .r { display: flex; align-items: center; gap: 6px; } .tip .r b { margin-left: auto; font-variant-numeric: tabular-nums; }
.tip i { width: 8px; height: 8px; border-radius: 2px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; margin-top: 16px; }
.lines { list-style: none; margin: 0; padding: 8px 16px 14px; display: grid; gap: 0; }
.lines li { padding: 9px 0; border-top: 1px solid var(--line); display: flex; gap: 10px; font-size: 13px; }
.lines li:first-child { border-top: 0; }
.lines li span { color: var(--ink-3); margin-left: auto; white-space: nowrap; }
table.ht { width: 100%; border-collapse: collapse; font-size: 13px; }
.ht th { text-align: left; font-weight: 500; color: var(--ink-3); font-size: 12px; padding: 12px 12px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.ht td b { font-family: var(--mono); color: var(--host); font-weight: 500; }
.ht td { padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.ht tr:last-child td { border-bottom: 0; }
.ht tbody tr { cursor: pointer; } .ht tbody tr:hover { background: var(--hover); }
.ht .num { text-align: right; font-variant-numeric: tabular-nums; }
.ht .z { color: var(--ink-3); }
.ht .os { color: var(--ink-2); max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
.tablewrap { overflow-x: auto; }
.lead { font-size: 15px; color: var(--ink-2); margin: 4px 0 0; }
.lead b { color: var(--ink); }

/* states */
.banner { margin: 12px 24px 0; padding: 10px 14px; border-radius: var(--r-panel); border: 1px solid var(--line-2); background: var(--raised); display: flex; gap: 12px; align-items: center; font-size: 13px; }
.banner .bar { flex: 1; max-width: 240px; height: 4px; background: var(--line-2); border-radius: 2px; overflow: hidden; }
.banner .bar i { display: block; height: 100%; width: 57%; background: var(--accent-line); }
.banner.err { border-color: color-mix(in srgb, var(--err) 50%, var(--line)); }
.banner.err svg { color: var(--err); }
.onb { max-width: 560px; margin: 48px auto; padding: 0 24px; }
.onb h2 { font-size: 22px; letter-spacing: -.015em; margin: 0 0 6px; }
.onb p { color: var(--ink-2); margin: 0 0 20px; }
.steps { list-style: none; padding: 0; margin: 0 0 20px; border: 1px solid var(--line); border-radius: var(--r-panel); background: var(--surface); }
.steps li { display: flex; gap: 12px; padding: 14px 16px; border-top: 1px solid var(--line); align-items: flex-start; }
.steps li:first-child { border-top: 0; }
.steps .ok { color: var(--ok); } .steps small { display: block; color: var(--ink-3); }
.sk { background: linear-gradient(90deg, var(--raised), var(--hover), var(--raised)); background-size: 200% 100%; animation: sk 1.2s linear infinite; border-radius: 4px; height: 12px; }
@keyframes sk { to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) { .sk { animation: none; } .selbar, .btn, .pr { transition: none; } }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 16px); opacity: 0; background: var(--ink); color: var(--bg); padding: 9px 14px; border-radius: var(--r-ctl); font-size: 13px; transition: .2s var(--ease); z-index: 50; pointer-events: none; }
.toast.on { transform: translate(-50%, 0); opacity: 1; }
.menu { position: absolute; z-index: 40; background: var(--raised); border: 1px solid var(--line-2); border-radius: var(--r-ctl); box-shadow: var(--shadow); padding: 4px; min-width: 200px; }
.menu button { display: flex; width: 100%; gap: 8px; align-items: center; padding: 7px 10px; border: 0; background: none; border-radius: 4px; text-align: left; }
.menu button:hover { background: var(--hover); }
.menu .sep { border-top: 1px solid var(--line); margin: 4px 0; }
.menu small { color: var(--ink-3); margin-left: auto; }
dialog { border: 1px solid var(--line-2); border-radius: var(--r-panel); background: var(--surface); color: var(--ink); padding: 0; width: min(640px, calc(100vw - 32px)); box-shadow: var(--shadow); }
dialog::backdrop { background: rgba(0,0,0,.5); }
dialog header { padding: 16px 20px; border-bottom: 1px solid var(--line); display: flex; align-items: center; }
dialog header h3 { margin: 0; font-size: 16px; }
dialog header .btn { margin-left: auto; }
dialog .body { padding: 8px 20px 20px; max-height: 60vh; overflow: auto; }
dialog ol { padding-left: 18px; } dialog li { margin: 10px 0; }
dialog footer { padding: 12px 20px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; }
.note { color: var(--ink-3); font-size: 12px; }


.t .title code { font-size: 13px; color: var(--ink); font-weight: 500; }

/* ===== setup: the brand on the left, one window on the right (the banner's layout) ===== */

#setupform { display: grid; gap: 26px; }

.go { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 4px; }

.sbar { display: flex; align-items: center; height: 32px; border-top: 1px solid var(--line); font: 12px var(--mono); color: var(--ink-3); white-space: nowrap; overflow: hidden; }

.dot.bad { background: var(--err); } .dot.wn { background: var(--p2); } .dot.mut { background: var(--ink-3); }
.vrow .dot { display: inline-block; vertical-align: 1px; }
.ipi { color: var(--ink-3); margin-left: 8px; font-family: var(--font); font-size: 12px; }
@container list (max-width: 900px) { .vhead, .vrow { grid-template-columns: var(--c2); } .vt .k3 { display: none; } }
@container list (max-width: 620px) { .vhead, .vrow { grid-template-columns: var(--c3); padding: 0 12px 0 12px; column-gap: 10px; } .vt .k2 { display: none; } }
.u { display: inline-flex; align-items: center; gap: 8px; font: 12.5px var(--mono); }
.u i { width: 40px; height: 4px; border-radius: 2px; background: var(--line-2); overflow: hidden; display: block; flex: none; }
.u i b { display: block; height: 100%; background: var(--ink-3); }
.u.hi i b { background: var(--p2); } .u.hi { color: var(--p2); }
.u.crit i b { background: var(--p1); } .u.crit { color: var(--p1); font-weight: 600; }
.spk { display: flex; align-items: flex-end; gap: 1px; height: 22px; }
.spk i { width: 3px; min-height: 1px; background: var(--p2); display: block; }

.kv > span:first-child { color: var(--ink-3); }

.kv code, .kv .m { font-family: var(--mono); font-size: 12.5px; }
.bigmono.hn { color: var(--host); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.tbl td.m { font: 12.5px var(--mono); }
.tbl .nw { white-space: nowrap; }
.tbl .ell { max-width: 0; width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.detail .term { margin: 10px 0 0; max-height: 420px; }
.dnote { font-size: 12.5px; color: var(--ink-3); margin-top: 8px; }
.vt { padding-bottom: 96px; }
.vt .empty { margin: 24px 16px; }
@media (max-width: 860px) { .counts.vc { padding: 0; } .spkw { display: none; } }
/* Servers: one row per server, its fixes under it (the tree's rows, its own columns) */
.svh, .sv { display: grid; grid-template-columns: 22px 28px minmax(0, 1fr) 132px 56px 84px; align-items: center; column-gap: 10px; padding: 0 16px 0 10px; }
.svh { position: sticky; top: 0; z-index: 3; height: 32px; font-size: 11.5px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .04em; background: var(--bg); border-bottom: 1px solid var(--line); }
.svh > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sv { min-height: 40px; border-bottom: 1px solid var(--line); cursor: pointer; position: relative; font-size: 13.5px; white-space: nowrap; }
.sv.kid { min-height: 34px; font-size: 13px; background: color-mix(in srgb, var(--solid) 55%, transparent); }
.sv:hover { background: var(--hover); }
.sv[aria-selected="true"] { background: var(--sel); }
.sv > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.svh .r, .sv .r { text-align: right; }
.sv .r, .sv .pcs { font: 12.5px var(--mono); color: var(--ink-3); font-variant-numeric: tabular-nums; }
.sv .nm { display: flex; align-items: baseline; gap: 10px; }
.sv .nm > * { flex: none; }
.sv .nm .os, .sv .nm .ttl, .sv .nm .from { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.sv .nm .os { color: var(--ink-3); font-size: 12.5px; }
.sv .nm code { font-size: 13px; } .sv .nm .pkg { color: var(--ink); font-weight: 500; } .sv .nm .from { color: var(--ink-3); } .sv .nm .to { color: var(--ok); } .sv .nm .arr { color: var(--ink-3); }
.sv .nm .ttl { color: var(--ink-2); } .sv .nm .cveid { font-family: var(--mono); }
.sv.clean .hostn, .sv.failed .hostn, .sv.not_scanned .hostn { color: var(--ink-2); }
.sv .hostn { font-family: var(--mono); color: var(--host); }
.tgt { flex: none; align-self: center; font: 11px/16px var(--mono); color: var(--ink-3); border: 1px solid var(--line-2); border-radius: 4px; padding: 0 5px; }
.sv .nm .os.prob { color: var(--ink-2); }
.inet { flex: none; align-self: center; font: 11px/16px var(--mono); color: var(--p2); border: 1px solid color-mix(in srgb, var(--p2) 40%, transparent); border-radius: 4px; padding: 0 5px; }
.pcs i { font-style: normal; opacity: .5; margin: 0 4px; } .pcs b { font-weight: 600; }
.mk { display: inline-flex; align-items: center; justify-content: center; flex: none; align-self: center; width: 28px; height: 18px; font: 600 13px/18px var(--mono); }
.mk.ok { color: var(--ok); } .mk.bad { color: var(--err); } .mk.wn { color: var(--p2); } .mk.mut { color: var(--ink-3); }
.late { color: var(--p1) !important; }
@container list (max-width: 760px) { .svh, .sv { grid-template-columns: 22px 28px minmax(0, 1fr) auto 76px; } .c-fx { display: none; } }
@container list (max-width: 520px) { .svh, .sv { grid-template-columns: 18px 28px minmax(0, 1fr) auto; padding: 0 12px 0 6px; } .c-sc { display: none; } .sv .nm .os, .sv .nm .from { display: none; } }
@media (max-width: 860px) { .bar2.vbar { flex-wrap: wrap; overflow: visible; } .bar2.vbar .search { order: -1; flex: 1 1 100%; } .bar2.vbar .chips { flex-wrap: nowrap; overflow-x: auto; max-width: 100%; } }
/* the server card: a few facts, then short lists with fixed-size marks */
.dmeta { color: var(--ink-3); font-size: 12.5px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dkv { margin-top: 12px; }
.lis { display: grid; }
.li { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; column-gap: 10px; align-items: center; min-height: 32px; border-top: 1px solid var(--line); font-size: 13px; }
.lis .li:first-child { border-top: 0; }
.li > span:nth-child(2) { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li > span:nth-child(3) { font: 12.5px var(--mono); color: var(--ink-3); white-space: nowrap; text-align: right; }
.li code { font: 12.5px var(--mono); }
</style>

<script>
"use strict";
/* Kanareika dashboard. Data: /api/orgs, /api/env, /api/tree, /api/node, /api/prompt, /api/jobs, /api/db; first run:
   /api/setup, /api/setup/check, /api/scan. The TUI shows the same nodes from the same API. */
const CSRF = /*CSRF*/"";
const UI = /*I18N_UI*/{};
const LANG_NAMES = /*I18N_NAMES*/{};
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const icon = (n) => `<svg class="i" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const store = {
  get(k, d) { try { return localStorage.getItem("kanareika." + k) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("kanareika." + k, v); } catch {} },
};
const LANG = new URLSearchParams(location.search).get("lang") || store.get("lang", "en");
const t = (s, args) => {
  let out = (UI[LANG] && UI[LANG][s]) || s;
  if (args) for (const [k, v] of Object.entries(args)) out = out.replaceAll("{" + k + "}", v);
  return out;
};

async function api(path) {
  const r = await fetch(path, { cache: "no-store" });
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(body.error || r.statusText), { status: r.status, body });
  return body;
}
async function post(path, data) {
  const r = await fetch(path, { method: "POST", cache: "no-store", headers: { "Content-Type": "application/json", "X-Kanareika-CSRF": CSRF }, body: JSON.stringify(data || {}) });
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(body.error || r.statusText), { status: r.status, body });
  return body;
}

/* ---------- state ---------- */
const S = {
  orgs: [], org: store.get("org", ""), env: store.get("env", ""), run: "current", runs: [],
  view: "servers", lens: "priorities", accepted: false, by: store.get("by", "fix"), flt: new Set(), q: "", open: new Set(), cur: null, stack: [], sel: new Set(),
  tree: null, theme: store.get("theme", "system"), scans: false, db: null, jobs: [], setup: null,
};
const today = () => new Date().toISOString().slice(0, 10);
const days = (d) => Math.round((new Date(d + "T00:00:00Z") - new Date(today() + "T00:00:00Z")) / 864e5);
const fmtDay = (d) => new Date(d + "T00:00:00Z").toLocaleDateString(LANG, { day: "numeric", month: "short", timeZone: "UTC" });
const dueText = (d) => { if (!d) return ""; const n = days(d); return n < 0 ? t("{n} d late", { n: -n }) : n < 14 ? t("in {n} d", { n }) : fmtDay(d); };
const pct = (e) => (e >= 0.1 ? Math.round(e * 100) + "%" : e >= 0.01 ? (e * 100).toFixed(1) + "%" : e > 0 ? "<1%" : "");
const ago = (iso) => {
  if (!iso) return t("never");
  const h = (Date.now() - new Date(iso).getTime()) / 36e5;
  return h < 1 ? t("just now") : h < 48 ? t("{n} h ago", { n: Math.round(h) }) : t("{n} d ago", { n: Math.round(h / 24) });
};
const qs = (o) => Object.entries(o).filter(([, v]) => v !== "" && v != null).map(([k, v]) => k + "=" + encodeURIComponent(v)).join("&");
const scope = () => ({ org: S.org, env: S.env, run: S.run });

/* ---------- theme ---------- */
const darkMQ = matchMedia("(prefers-color-scheme: dark)");
function applyTheme() { document.documentElement.dataset.theme = S.theme === "system" ? (darkMQ.matches ? "dark" : "light") : S.theme; }
darkMQ.addEventListener("change", applyTheme);
applyTheme();

/* ---------- sidebar ---------- */
const NAV = [["servers", "Servers", "server"], ["todo", "ToDo", "list"], ["history", "History", "clock"]];
const isTree = (v) => v === "servers" || v === "todo";
const orgOf = () => S.orgs.find((o) => o.id === S.org);
const envOf = () => orgOf()?.envs.find((e) => e.env === S.env);

function sel(id, label, opts, cur) {
  return `<label class="srow"><span class="sl">${label}</span><select id="${id}" aria-label="${label}">${opts.map(([v, txt]) =>
    `<option value="${esc(v)}" ${v === cur ? "selected" : ""}>${esc(txt)}</option>`).join("")}</select>${icon("chev")}</label>`;
}
const viewHref = (v) => "/" + v + "?" + qs({ org: S.org, env: S.env });
// the number beside a view: what needs a look there (from the run shown, once loaded)
function navCount(v) {
  const rd = RD.key === [S.org, S.env, S.run].join("|") ? RD.data : null;
  if (v === "servers") return envOf() ? `<span class="n">${envOf().hosts}</span>` : "";
  if (v === "todo") { const f = rd?.totals?.fixes ?? S.tree?.fixes; return f != null ? `<span class="n hot">${f}</span>` : ""; }
  return "";
}
function renderSide() {
  const o = orgOf(), e = envOf();
  const orgOpts = S.orgs.map((x) => [x.id, x.name || x.id]);
  if (S.scans) orgOpts.push(["__new", "+ " + t("Add servers…")]);
  $("#scope").innerHTML = S.orgs.length ? sel("org", t("Org"), orgOpts, S.org) +
    sel("env", t("Env"), (o?.envs || []).map((x) => [x.env, `${x.env} · ${x.hosts}${x.last ? "" : " · " + t("no scans")}`]), S.env) +
    sel("run", t("Data"), [["current", t("Current state")], ...S.runs.slice(-20).reverse().map((r) => [r.run_id, r.run_id.replace("_", " ").replace(/(\d\d)(\d\d)(\d\d)$/, "$1:$2") + (r.partial ? " · " + t("partial") : "")])], S.run) : "";
  if (!S.orgs.length || S.view === "setup" && !envOf()?.last) {
    $("#nav").innerHTML = NAV.map((n) => n === "-" ? "<hr>" : `<a class="off" aria-disabled="true" title="${t("Available after the first scan")}">${icon(n[2])}${t(n[1])}</a>`).join("") +
      `<div class="navnote">${t("Available after the first scan")}</div>`;
  } else $("#nav").innerHTML = S.orgs.length ? NAV.map((n) => n === "-" ? "<hr>" :
    `<a href="${viewHref(n[0])}" data-view="${n[0]}" ${S.view === n[0] ? 'aria-current="page"' : ""}>${icon(n[2])}${t(n[1])}${navCount(n[0])}</a>`).join("") : "";
  const db = S.db, dbOld = db && (db.dbs || []).some((d) => d.outdated), feedsOld = db?.feeds_outdated;
  const dbAt = db && (db.dbs || []).map((d) => d.updated).filter(Boolean).sort()[0];
  $("#status").innerHTML = (e ? `<div class="row"><span class="dot ${e.last ? "" : "warn"}"></span><span>${t("Data")} <b>${e.last ? ago(e.last.finished) : t("none yet")}</b>${e.last ? ` · ${e.last.hosts_total - (e.last.hosts_failed || 0)}/${e.last.hosts_total} ${t("hosts")}` : ""}</span></div>` : "") +
    (db ? `<div class="row"><span class="dot ${dbOld || feedsOld ? "warn" : ""}"></span><span>${t("Vulnerability list")} <b>${db.updating ? t("downloading…") : dbAt ? ago(dbAt) : t("not downloaded")}</b>${feedsOld && dbAt ? " · " + t("exploit data old") : ""}</span></div>` : "") +
    (S.scans && e && S.view !== "setup" ? `<button class="btn" id="scanbtn">${icon("scan")}${t("Scan {env}…", { env: esc(S.env) })}</button>` : "") +
    `<div class="foot2"><label class="langw" title="${t("Language")}"><select id="lang" aria-label="${t("Language")}">${Object.entries(LANG_NAMES).map(([k, n]) => `<option value="${k}" ${k === LANG ? "selected" : ""}>${esc(n)}</option>`).join("")}</select><span class="lv">${LANG.toUpperCase()}</span>${icon("chev")}</label>
      <div class="seg3" role="radiogroup" aria-label="${t("Theme")}">${[["light", "sun", "Light"], ["system", "monitor", "System"], ["dark", "moon", "Dark"]].map(([v, i, l]) => `<button role="radio" data-theme-set="${v}" aria-checked="${S.theme === v}" title="${t(l)}" aria-label="${t(l)}">${icon(i)}</button>`).join("")}</div></div>`;
}

/* ---------- tree rows ---------- */
const ST = { available: "fix ready", reboot: "reboot pending", vendor: "no fix yet", backported: "fixed (backport)", other: "" };
function kindSlot(n) {
  const k = n.kind === "image" || n.kind === "where" ? [n.runtime, "img"]
    : n.kind === "pkg" ? [n.path ? "lib" : "os", "mut"] : n.kind === "part" ? [n.path ? "lib" : "os", "mut"]
    : n.kind === "other" ? [n.title, "mut"] : n.kind === "cve" ? [(n.severity || "").slice(0, 4).toLowerCase(), "sev-" + n.severity] : ["", ""];
  return `<span class="kd ${k[1]}">${esc(k[0])}</span>`;
}
function mainText(n) {
  const ver = n.fixed ? `<code class="from" title="${esc(n.installed)}">${esc(n.installed)}</code><code class="arr">→</code><code class="to">${esc(n.fixed)}</code>`
    : n.installed ? `<code class="from">${esc(n.installed)}</code><span class="ttl">${esc(noFixTxt(n.no_fix))}</span>` : "";
  switch (n.kind) {
    case "pkg": case "part": return `<code class="pkg">${esc(n.label)}</code>${ver}${n.path ? `<code class="kind path" title="${esc(n.path)}">${esc(n.path)}</code>` : ""}`;
    case "image": return `<code class="pkg">${esc(n.label.replace(/^.*\//, ""))}</code><span class="ttl" title="${esc(n.label)}">${t("rebuild the image")}</span>`;
    case "where": return `<span class="ttl" style="color:var(--ink)">${esc(n.label)}</span>`;
    case "cve": return `<span class="cveid">${esc(n.label)}</span><span class="ttl">${esc(n.title)}</span>`;

let DETAIL = null;
async function show(id, push, quiet) {
  const node = S.view === "servers" ? SRV.byId[id] : find(id);
  if (node?.kind === "host") return showServer(node, quiet);
  S.cardHost = "";
  const prev = DETAIL?.node;
  if (push && prev) S.stack.push({ id: prev.id, label: prev.label }); else if (!push) S.stack = [];
  S.cur = id;
  document.querySelectorAll(".node[data-n], .sv[data-n]").forEach((r) => r.setAttribute("aria-selected", r.dataset.n === id));
  document.querySelectorAll(".hc").forEach((r) => r.setAttribute("aria-pressed", r.dataset.n === id));
  try { DETAIL = await api("/api/node?" + qs({ ...scope(), by: S.by, f: [...S.flt].join(","), q: S.q, backported: S.backport ? 1 : "", id })); }
  catch (e) {
    if (!id.startsWith("cve:")) { $("#detail").innerHTML = `<div class="nodetail">${esc(e.message)}</div>`; return; }
    // a CVE from a fix's details: look it up in the CVE grouping
    try { DETAIL = await api("/api/node?" + qs({ ...scope(), by: "cve", id })); } catch (e2) { $("#detail").innerHTML = `<div class="nodetail">${esc(e2.message)}</div>`; return; }
  }
  $("#detail").innerHTML = detailHTML(DETAIL);
  $("#detail").scrollTop = 0;
  if (!quiet && matchMedia("(max-width: 1240px)").matches) $("#detail").classList.add("open");
}
function context(d) {
  const n = d.node;
  const lines = [`Kanareika ${S.org}/${S.env}: ${n.kind} ${n.label}${n.installed ? ` ${n.installed} -> ${n.fixed || "no fix yet"}` : ""}`,
    `priority ${n.priority}, due ${d.due.date || "-"}${d.due.overdue ? ` (${d.due.overdue} d overdue)` : ""}; ${n.hosts} hosts, ${n.cves} CVE`,
    `why: ${d.why.map(whyText).join("; ")}`,
    `where: ${d.where.map((w) => `${w.group} (${w.hosts.join(", ")})`).join("; ")}`];
  if (d.cves.length) lines.push(`CVE: ${d.cves.map((c) => `${c.id} ${c.severity}${c.kev ? " KEV" : ""}${c.epss ? " EPSS " + pct(c.epss) : ""}`).join(", ")}`);
  (d.apply || []).forEach((s) => lines.push(`apply on ${s.hosts.join(", ")}: ${s.command}`));
  lines.push(`MCP: get_fix org=${S.org} env=${S.env} id=${n.id}`);
  return lines.join("\n");
}

/* ---------- onboarding: two paths. A few servers: one address, everything else guessed from this machine's SSH
   setup. A fleet: a list (CSV, Ansible inventory, ~/.ssh/config), groups, environments, a jump host. ---------- */
const FOUND = { v: null };
async function discover() { if (!FOUND.v) { try { FOUND.v = await api("/api/setup/discover"); } catch { FOUND.v = { user: "", keys: [], agent_keys: 0, hosts: [] }; } } return FOUND.v; }
function freeId(base) { let id = base, i = 2; while (S.orgs.some((o) => o.id === id)) id = base + "-" + i++; return id; }
/* ---------- setup: one window, as on the banner. Steps at /setup, /setup/access, /setup/scan ---------- */
const STEP_PATH = { 1: "/setup", 2: "/setup/connect", 3: "/setup/scan" };
function setupURL(s) { const p = STEP_PATH[s.step] || "/setup"; if (location.pathname !== p) history.replaceState(null, "", p + location.search); }
function stepTabs(s) {

/* the vulnerability list: offered first, downloaded only on a click (mobile data), shown again in the status bar */
function bytes(n) { return n >= 1e9 ? (n / 1e9).toFixed(1) + " GB" : n >= 1e6 ? Math.round(n / 1e6) + " MB" : n > 0 ? Math.max(1, Math.round(n / 1e3)) + " KB" : "?"; }
function dlTotal() { const z = S.dbsize; return z ? z.total : 0; }
function dlNeeded() { const z = S.dbsize; return !!z && z.need.length > 0; }
function dbCard() { // the line at the top of the window
  const z = S.dbsize, db = S.db || {};
  if (!z) return `<div class="dlline"></div>`;
  if (db.updating) {
    const secs = Math.round((Date.now() - Date.parse(S.dlStart || new Date())) / 1000);
    return `<div class="dlline busy"><span class="lbl">${t("vulnerability list")}</span><span class="bar"><i></i></span><span class="mut">${secs} s</span></div>`;
  }
  if (db.error && S.dlAsked) return `<div class="dlline bad"><span class="lbl">${t("vulnerability list")}</span><span class="err" title="${esc(db.error)}">${t("failed")}</span><button class="dlbtn" data-dl-start>${t("retry")}</button></div>`;
  if (!z.need.length) return `<div class="dlline ok"><span class="lbl">${t("vulnerability list")}</span><span class="okc">✓ ${t("ready")}</span></div>`;
  // what the total is made of: on hover, not on the page (less text)
  const part = (keys) => keys.filter((k) => z.need.includes(k)).reduce((n, k) => n + (z.sizes[k] || 0), 0);
  const tip = [[t("Linux packages and libraries"), part(["db"])], [t("IP locations"), part(["dbip-city", "dbip-asn"])], [t("exploit data (KEV, EPSS)"), part(["kev", "epss"])]]
    .filter(([, n]) => n).map(([l, n]) => `${l}: ${bytes(n)}`).concat(z.sizes["java-db"] ? [t("Java libraries: {size}, only if a scan finds .jar files", { size: bytes(z.sizes["java-db"]) })] : []).join("\n");
  return `<div class="dlline"><span class="lbl">${t("vulnerability list")}</span><span class="mut tipped" title="${esc(tip)}" tabindex="0">${bytes(z.total)}</span><button class="dlbtn" data-dl-start>↓ ${t("download")}</button></div>`;
}
function statusBar(s) {

}
let dbTick;

/* step 1: whose servers, which, how to log in — one form for the three audiences */

// editor: line numbers | the text | what each line becomes, on the same row
// empty: one plain field with examples; once there is text, what each line becomes appears beside it
function editor(text) {
  const n = edRows(text);
  return `<div class="ed ${text.trim() ? "" : "blank"}" id="ed">
    <div class="ln" id="edln">${Array.from({ length: n }, (_, i) => i + 1).join("<br>")}</div>
    <textarea name="hosts" id="pastebox" spellcheck="false" wrap="off" rows="${n}" placeholder="admin@192.0.2.10&#10;ssh -p 2222 deploy@203.0.113.7&#10;nas" aria-label="${t("Servers")}">${esc(text)}</textarea>
    <div class="dx" id="preview" aria-live="polite"></div></div>`;
}
function edRows(text) { return Math.max(3, text.split("\n").length + (text.endsWith("\n") ? 0 : 1)); }
let previewTimer;
function grow(ta) {
  const n = edRows(ta.value);
  ta.rows = n; const ln = $("#edln"); if (ln) ln.innerHTML = Array.from({ length: n }, (_, i) => i + 1).join("<br>");
  $("#ed")?.classList.toggle("blank", !ta.value.trim());
}
async function preview() {
  const ta = $("#pastebox"), out = $("#preview"); if (!ta || !out) return;
  grow(ta);
  if (!ta.value.trim()) { out.innerHTML = ""; S.setup.parsed = null; return; }
  const text = ta.value;
  let r; try { r = await post("/api/setup/parse", { text }); } catch (e) { out.innerHTML = `<div class="bad">${esc(e.message)}</div>`; return; }
  if (ta.value !== text) return; // an older answer
  S.setup.parsed = r;
  const d = FOUND.v || {}, defUser = $("[name=user]")?.value || S.setup.form.user || d.user || "root";
  const rows = [];
  r.hosts.forEach((h) => { if (h.line) rows[h.line] = `<div><span class="dn">${h.line}</span><span class="arr">→</span> <span class="h">${esc((h.user || defUser) + "@" + h.address)}</span>${h.jump ? `<span class="mut"> via ${esc(h.jump)}</span>` : ""}${h.from ? `<span class="mut"> ${t("from ssh config")}</span>` : ""}</div>`; });
  const loose = [];
  r.errors.forEach((x) => {
    const m = x.match(/^line (\d+): (?:"[^"]*"(?::\s*|\s+))?(.*)$/);
    const msg = `<div>${m ? `<span class="dn">${m[1]}</span>` : ""}<span class="arr">→</span> <span class="wn">${esc(m ? m[2] : x)}</span><span class="mut"> · ${t("skipped")}</span></div>`;
    if (m && !rows[+m[1]]) rows[+m[1]] = msg; else loose.push(msg);
  });
  const n = text.split("\n").length;
  out.innerHTML = Array.from({ length: n }, (_, i) => rows[i + 1] || `<div class="gap">&nbsp;</div>`).join("") + loose.join("");
}

function formData(form) {
  const fd = new FormData(form), g = (k) => (fd.get(k) ?? "").toString().trim();
  const f = S.setup.form;
  Object.assign(f, { hosts: fd.get("hosts") ?? f.hosts, confirmed: !!fd.get("confirmed") });
  if (fd.has("name")) f.name = g("name");
  if (fd.has("consent")) f.consent = g("consent");
  if (fd.has("user")) { f.user = g("user"); f.key = g("key"); f.sudo = !!fd.get("sudo"); }
  if (fd.has("env")) { f.env = g("env") || "production"; f.jump = g("jump"); }
  return f;
}
async function submitServers(form) {
  const s = S.setup, f = formData(form), d = await discover();
  const err = (m) => { $("#formerr").innerHTML = `<p class="ferr">${esc(m)}</p>`; };
  if (!f.hosts.trim()) return err(t("Paste at least one server."));
  if (s.kind !== "personal" && s.kind !== "add" && !f.name) return err(s.kind === "client" ? t("Name the client.") : t("Name the company."));
  if (s.kind !== "personal" && s.kind !== "add" && !f.consent) return err(t("Say where the permission is documented."));
  if (!f.confirmed) return err(t("Confirm that you are allowed to audit these servers."));
  // the key the Login line shows: the agent's keys, else the first key in ~/.ssh
  const key = f.key || (d.agent_keys ? "" : d.keys[0] || "");
  const base = { user: f.user || d.user || "root", privilege: f.sudo ? "sudo" : "none", key, hosts: f.hosts, internet: false, confirmed: f.confirmed };
  if (s.kind === "add") return addHosts(orgOf(), { hosts: f.hosts, user: f.user });
  if (s.kind === "personal") {
    const mine = S.orgs.find((o) => o.id === "servers");
    if (mine) return addHosts(mine, { hosts: f.hosts, user: f.user });
    return createOrg({ ...base, id: "servers", name: t("Personal"), env: "production", consent: t("Confirmed in the setup on {d}", { d: today() }) });
  }
  const id = freeId(f.name.toLowerCase().normalize("NFKD").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || s.kind);
  return createOrg({ ...base, id, name: f.name, env: s.kind === "company" ? f.env || "production" : "production", jump: f.jump, consent: f.consent });
}
async function addHosts(org, body) {
  const s = S.setup;
  try {
    const r = await post("/api/setup/add", { org: org.id, ...body });
    await loadOrgs();
    const o = S.orgs.find((x) => x.id === org.id);
    s.org = org.id; s.env = (o?.envs.find((e) => e.env === S.env) || o?.envs[0])?.env || "production"; s.only = r.added; s.file = ""; s.skipped = r.skipped || []; s.res = {}; s.hosts = null;
    s.step = 2; s.results = null; render(); checkAccess();
  } catch (e) { formErrors(e); }
}
async function createOrg(body) {
  const s = S.setup;
  try {
    const r = await post("/api/setup", body);
    s.org = r.org; s.file = r.path; s.env = body.env; s.step = 2; s.results = null; s.res = {}; s.hosts = null; s.only = null; s.skipped = r.skipped || [];

  } catch (e) { formErrors(e); }
}
function formErrors(e) { const errs = e.body?.errors || [e.message]; $("#formerr").innerHTML = errs.map((x) => `<p class="ferr">${esc(x)}</p>`).join(""); }

/* step 2: rows as in the TUI, grouped by outcome; one cause, its hosts, the fix */
function checkView(s) {
  const hosts = s.hosts || [], res = s.res || {};
  const ok = hosts.filter((h) => res[h.name]?.ok), bad = hosts.filter((h) => res[h.name] && !res[h.name].ok), waiting = hosts.filter((h) => !res[h.name]);
  const secs = Math.round((Date.now() - (s.started || Date.now())) / 1000);
  const who = (h) => esc(h.login || h.address || h.name);
  const row = (mark, h, note) => `<div class="hr">${mark}<span class="h">${who(h)}</span><span class="mut">${note}</span></div>`;
  const causes = {};
  bad.forEach((h) => { const r = res[h.name], k = r.hint || r.error; (causes[k] ||= { r, hosts: [] }).hosts.push(h); });
  const fixFor = (c) => /authenticat|permission denied|publickey|refused the login/i.test(c.r.error + c.r.hint)
    ? c.hosts.slice(0, 3).map((h) => { const [host, port] = (h.address || "").split(/:(?=\d+$)/); return `<code>ssh-copy-id${port ? " -p " + port : ""} ${esc((h.user ? h.user + "@" : "") + host)}</code>`; }).join("") : "";
  const groups = [];
  if (waiting.length) groups.push(`<div class="grp"><div class="gh"><i class="spin"></i>${t("{n} connecting", { n: waiting.length })}<span class="mut"> · ${secs} s</span></div>${waiting.map((h) => row(`<i class="spin"></i>`, h, h.jump ? "via " + esc(h.jump) : "")).join("")}</div>`);
  Object.values(causes).forEach((c) => {
    const same = c.hosts.every((h) => res[h.name].error.replace(/^[^:]+:\s*/, "") === c.r.error.replace(/^[^:]+:\s*/, "")); // one error for all: said once
    groups.push(`<div class="grp"><div class="gh"><span class="bad">✗</span>${esc(c.r.hint || c.r.error)}</div>${c.hosts.map((h) => row(`<span class="bad">✗</span>`, h, c.r.hint && !same ? esc(res[h.name].error.replace(/^[^:]+:\s*/, "")) : "")).join("")}${fixFor(c) ? `<div class="fix">${fixFor(c)}</div>` : ""}</div>`);
  });

let checkTick;
async function checkAccess(onlyFailed) {
  const s = S.setup;
  if (!s.hosts) {
    try { const e = await api("/api/env?" + qs({ org: s.org, env: s.env })); s.hosts = (e.hosts || []).filter((h) => !s.only || s.only.includes(h.name)).map((h) => ({ name: h.name, address: h.address, user: h.user, jump: h.jump, login: (h.user ? h.user + "@" : "") + h.address })); }
    catch { s.hosts = []; }
  }
  s.res ||= {};
  const todo = s.hosts.filter((h) => !onlyFailed || (s.res[h.name] && !s.res[h.name].ok));
  todo.forEach((h) => delete s.res[h.name]);
  s.started = Date.now();
  clearInterval(checkTick);
  checkTick = setInterval(() => { if (S.view === "setup" && S.setup?.step === 2) $("#view").innerHTML = setupView(); else clearInterval(checkTick); }, 1000);
  render();
  let i = 0;
  const worker = async () => {
    while (i < todo.length) {
      const h = todo[i++];
      try { const r = await post("/api/setup/check", { org: s.org, env: s.env, hosts: [h.name] }); s.res[h.name] = r.results[0] || { ok: false, error: t("no answer") }; }
      catch (e) { s.res[h.name] = { ok: false, error: e.message }; }
      if (S.view === "setup") $("#view").innerHTML = setupView();
    }
  };
  await Promise.all(Array.from({ length: Math.min(8, todo.length) }, worker));
  clearInterval(checkTick);
  s.results = s.hosts.map((h) => ({ host: h.name, ...s.res[h.name] }));
  if (S.view === "setup") $("#view").innerHTML = setupView();
}

  NAV.filter((n) => n !== "-").forEach((n) => it.push({ g: t("Go to"), label: t(n[1]), hint: n[0] === "todo" ? "/" : "/" + n[0], go: () => go(n[0]) }));
  lensList().forEach((l) => it.push({ g: t("Go to"), label: t(l.title), hint: "/servers?show=" + l.id, go: () => { S.lens = l.id; S.wantHost = ""; if (S.view === "servers") { syncURL(); render(); } else go("servers"); } }));
  it.push({ g: t("Go to"), label: t("Accepted risks"), hint: "/todo?f=accepted", go: () => { S.accepted = true; if (S.view === "todo") { syncURL(); render(); } else go("todo"); } });
  (S.envd?.hosts || []).forEach((h) => it.push({ g: t("Servers"), label: h.name, hint: h.group, go: () => openServer(h.name) }));
  [["fix", "Group by fix"], ["cve", "Group by CVE"]].forEach(([k, l]) => it.push({ g: t("Commands"), label: t(l), hint: "/todo", go: () => { S.by = k; store.set("by", k); S.open.clear(); S.cur = null; S.view === "todo" ? render() : go("todo"); } }));
  if (S.scans && S.env) it.push({ g: t("Commands"), label: t("Scan {env}", { env: S.env }), hint: "", go: () => startScan(S.org, S.env) });
  if (S.scans) it.push({ g: t("Commands"), label: t("Add servers…"), hint: "", go: () => { S.setup = null; S.view = "setup"; render(); } });
  return (q ? it.filter((x) => x.label.toLowerCase().includes(q)) : it.filter((x) => x.g !== t("Inside") && x.g !== t("Servers"))).slice(0, 50);
}
function palRender() {
  const xs = palItems($("#palq").value); PI = Math.min(PI, Math.max(0, xs.length - 1)); let g = "";
  $("#pall").innerHTML = xs.map((x, i) => (x.g !== g ? `<div class="grp">${esc((g = x.g))}</div>` : "") + `<li role="option" data-pi="${i}" aria-selected="${i === PI}">${esc(x.label)}<small>${esc(x.hint)}</small></li>`).join("") || `<div class="grp">${t("Nothing found")}</div>`;
  palRender.xs = xs; $("#pall li[aria-selected=true]")?.scrollIntoView({ block: "nearest" });
}
function palOpen() { $("#pal").classList.add("on"); $("#palq").value = ""; PI = 0; palRender(); $("#palq").focus(); }
function palClose() { $("#pal").classList.remove("on"); }

/* ---------- events ---------- */
document.addEventListener("click", async (e) => {
  const el = e.target.closest(".hc, button, a, .node, .sv, tr.link, [data-goto], [data-copy-text], input"); if (!el) return;
  const d = el.dataset;
  if (d.themeSet) { S.theme = d.themeSet; store.set("theme", S.theme); applyTheme(); renderSide(); return; }
  if (d.view) { if (!e.metaKey && !e.ctrlKey && !e.shiftKey) { e.preventDefault(); go(d.view); } return; }
  if (d.tw) { e.stopPropagation(); keepRow(d.tw, () => { S.open.has(d.tw) ? S.open.delete(d.tw) : S.open.add(d.tw); redraw(); }); return; }
  if (d.sel) { e.stopPropagation(); S.sel.has(d.sel) ? S.sel.delete(d.sel) : S.sel.add(d.sel); drawSelbar(); return; }
  if (el.classList.contains("node") || el.classList.contains("sv") || el.classList.contains("hc")) { if (d.n) show(d.n); return; }
  if (d.goto) { show(d.goto, true); return; }
  if ("back" in d) { const p = S.stack.pop(); if (p) { S.cur = p.id; DETAIL = await api("/api/node?" + qs({ ...scope(), by: S.by, f: [...S.flt].join(","), q: S.q, id: p.id })); $("#detail").innerHTML = detailHTML(DETAIL); } return; }
  if (d.by) { if (d.by === "host") { go("servers"); return; } S.by = d.by; store.set("by", d.by); S.open.clear(); S.cur = null; S.stack = []; if (S.view !== "todo") go("todo"); else render(); return; }
  if (d.flt) { S.flt.has(d.flt) ? S.flt.delete(d.flt) : S.flt.add(d.flt); el.setAttribute("aria-pressed", S.flt.has(d.flt)); S.view === "servers" ? loadServers() : loadTree(); return; }
  if ("acc" in d) { S.accepted = !S.accepted; S.cur = null; VS.item = null; VS.sel = ""; syncURL(); render(); return; }
  if ("bp" in d) { S.backport = !S.backport; loadTree(); return; }
  if ("allrows" in d) { const sc = $("#scroll").scrollTop; S.allRows = true; redraw(); $("#scroll").scrollTop = sc; return; }
  if ("expand" in d || "collapse" in d) { // the tree only: a full render would blank the list and lose the scroll
    if ("expand" in d) { // every level: the whole tree, once
      if (S.tree?.nodes.some((n) => n.more)) { try { S.tree = await api("/api/tree?" + qs(treeQS(true))); } catch (er) { toast(er.message); return; } }
      const all = (ns) => ns.forEach((n) => { if ((n.kids || []).length) { S.open.add(n.id); all(n.kids); } }); all(S.tree?.nodes || []);
    } else S.open.clear();
    const sc = "expand" in d ? $("#scroll").scrollTop : 0; redraw(); $("#scroll").scrollTop = sc; return; // collapsed: from the top
  }
  if ("clear" in d) { S.sel.clear(); drawTree(); return; }
  if ("reset" in d) { S.flt.clear(); S.q = ""; render(); return; }
  if (d.addsel) { S.sel.has(d.addsel) ? S.sel.delete(d.addsel) : S.sel.add(d.addsel); drawTree(); $("#detail").innerHTML = detailHTML(DETAIL); return; }
  if ("copytask" in d) { try { const r = await api("/api/prompt?" + qs({ ...scope(), lang: LANG, nodes: [...S.sel].join(",") })); copy(r.text, t("Task copied: paste it into your agent")); } catch (er) { toast(er.message); } return; }
  if (d.copytext) { copy(d.copytext); return; }
  if (d.copyctx && DETAIL) { copy(context(DETAIL), t("Context copied: paste it into your agent")); return; }
  if ("close" in d) { $("#detail").classList.remove("open"); return; }
  if (d.cancel) { try { await post(`/api/jobs/${d.cancel}/cancel`); } catch (er) { toast(er.message); } return; }
  if (el.id === "scanbtn" || "scanNow" in d) { await startScan(S.org, S.env); return; }
  if (el.id === "cmdk") { palOpen(); return; }
  if ("setupCancel" in d) { S.setup = null; S.view = "servers"; history.replaceState(null, "", "/" + location.search); render(); return; }
  if ("loginOpen" in d) { formData($("#setupform")); S.setup.loginOpen = true; render(); $("[name=user]")?.focus(); return; }
  if ("setupBack" in d) { S.setup.step = 1; render(); return; }
  if ("sshpick" in d) { await discover(); sshPicker(); return; }
  if ("pickclose" in d) { $("#dlg").close(); return; }
  if ("pickadd" in d) {
    const dd = await discover(), ta = $("#pastebox");
    const hs = [...document.querySelectorAll("#picklist input:checked")].map((c) => dd.hosts[+c.value]);
    $("#dlg").close();
    if (hs.length) { ta.value = (ta.value.trim() ? ta.value.trim() + "\n" : "") + hs.map((h) => h.alias).join("\n"); preview(); } // aliases resolve on the server
    return;
  }
  if ("dlStart" in d) {
    S.dlAsked = true;
    try { await post("/api/db/update", {}); } catch (er) { if (!/already running/.test(er.message)) { toast(er.message); return; } }
    S.dlStart = new Date().toISOString(); pollDB(); return;
  }
  if ("copyText" in d) { copy(d.copyText, t("Path copied")); return; }
  if ("setupRecheck" in d) { const s = S.setup; checkAccess(Object.values(s.res || {}).some((r) => !r.ok)); return; }
  if ("setupScan" in d) {
    const s = S.setup; await loadOrgs(); S.org = s.org; S.env = s.env; store.set("org", S.org); store.set("env", S.env);
    const ok = (s.results || []).filter((x) => x.ok).map((x) => x.host), all = (s.results || []).length;
    try { const r = await post("/api/scan", { org: s.org, env: s.env, hosts: ok.length < all || s.only ? ok : undefined }); s.job = r.id; pollJobs(); } catch (er) { toast(er.message); return; }
    s.step = 3; render(); return;
  }
  if ("setupDone" in d) { S.setup = null; S.view = "servers"; history.replaceState(null, "", "/" + location.search); await loadOrgs(); render(); return; }
});
document.addEventListener("submit", (e) => {
  if (e.target.id === "setupform") { e.preventDefault(); submitServers(e.target); }
});
document.addEventListener("change", async (e) => {
  const id = e.target.id, v = e.target.value;
  if (e.target.name === "kind" && S.setup) { formData($("#setupform")); S.setup.kind = v; render(); return; }
  if (id === "org") {
    if (v === "__new") { S.setup = null; S.view = "setup"; render(); return; }
    S.org = v; store.set("org", v); S.env = orgOf()?.envs[0]?.env || ""; store.set("env", S.env); S.run = "current"; S.cur = null; await loadEnv(); render();
  } else if (id === "env") { S.env = v; store.set("env", v); S.run = "current"; S.cur = null; await loadEnv(); render(); }
  else if (id === "run") { S.run = v; S.cur = null; render(); }
  else if (id === "lang") { store.set("lang", v); const u = new URL(location.href); u.searchParams.delete("lang"); location.href = u; }
});
let qTimer;
document.addEventListener("input", (e) => {
  if (e.target.id === "pickq") { const q = e.target.value.toLowerCase(); document.querySelectorAll("#picklist .pick").forEach((l) => (l.hidden = !l.dataset.alias.includes(q) && !l.textContent.toLowerCase().includes(q))); return; }
  if (e.target.id === "pastebox") grow(e.target);
  if (e.target.id === "pastebox" || e.target.name === "user") { clearTimeout(previewTimer); previewTimer = setTimeout(preview, 250); }
  if (e.target.id === "q") { S.q = e.target.value; clearTimeout(qTimer); qTimer = setTimeout(S.view === "servers" ? (S.lens === "priorities" ? loadServers : drawLens) : S.accepted ? drawAccepted : loadTree, 200); } else if (e.target.id === "palq") { PI = 0; palRender(); } });
// keepRow: the row toggled stays where it was on screen. A collapse near the end would shrink the list under the
// scroll position and pull everything down, so the list keeps its height until the rows fill the screen again.
function keepRow(id, fn) {
  const sc = $("#scroll"), tr = $("#tree"), row = () => document.querySelector(`[data-tw="${CSS.escape(id)}"]`);
  if (!sc || !tr) { fn(); return; }
  const y = row()?.getBoundingClientRect().top, h = tr.offsetHeight;
  fn();
  tr.style.minHeight = h + "px";
  const y2 = row()?.getBoundingClientRect().top;
  if (y != null && y2 != null) sc.scrollTop += y2 - y;
}
document.addEventListener("scroll", (e) => { // the kept height goes once real rows reach the bottom of the screen
  const tr = e.target.id === "scroll" && $("#tree"); if (!tr || !tr.style.minHeight) return;
  const last = tr.lastElementChild;
  if (!last || last.getBoundingClientRect().bottom >= e.target.getBoundingClientRect().bottom) tr.style.minHeight = "";
}, true);
// the sidebar on a phone: the menu button opens it over the page; a tap beside it, Esc or a view picked closes it
function sideOpen(on) {
  $("#side")?.classList.toggle("open", on); $("#scrim")?.classList.toggle("on", on); $("#menubtn")?.setAttribute("aria-expanded", on);
}
$("#menubtn").addEventListener("click", () => sideOpen(!$("#side").classList.contains("open")));
$("#scrim").addEventListener("click", () => sideOpen(false));
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && $("#side")?.classList.contains("open")) { sideOpen(false); return; }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); palOpen(); return; }
  if (e.target.id === "palq") {
    if (e.key === "ArrowDown") { PI = Math.min(PI + 1, palRender.xs.length - 1); palRender(); e.preventDefault(); }
    else if (e.key === "ArrowUp") { PI = Math.max(0, PI - 1); palRender(); e.preventDefault(); }
    else if (e.key === "Enter") { const x = palRender.xs[PI]; palClose(); x?.go(); }
    else if (e.key === "Escape") palClose();
    return;
  }
  if (e.target.matches?.("input, select, textarea")) { if (e.key === "Escape") e.target.blur(); return; }
  if (isData(S.view) || S.view === "servers" && S.lens !== "priorities" || S.view === "todo" && S.accepted) { vkeys(e); return; }
  if (!isTree(S.view)) return;
  const i = FLAT.findIndex((n) => n.id === S.cur), n = FLAT[i];
  const go = (m) => { if (!m) return; show(m.id); document.querySelector(`.node[data-n="${CSS.escape(m.id)}"]`)?.scrollIntoView({ block: "nearest" }); };
  if (e.key === "/") { e.preventDefault(); $("#q")?.focus(); }
  else if (e.key === "j" || e.key === "ArrowDown") { e.preventDefault(); go(FLAT[i + 1]); }
  else if (e.key === "k" || e.key === "ArrowUp") { e.preventDefault(); go(FLAT[i - 1]); }
  else if ((e.key === "l" || e.key === "ArrowRight") && ((n?.kids || []).length || n?.more)) { S.open.add(n.id); redraw(); }
  else if (e.key === "h" || e.key === "ArrowLeft") { if (n && S.open.has(n.id)) { S.open.delete(n.id); redraw(); } }
  else if (e.key === "Enter" && n) { e.preventDefault(); show(n.id); }
  else if ((e.key === "x" || e.key === " ") && n && S.view === "todo") { e.preventDefault(); S.sel.has(n.id) ? S.sel.delete(n.id) : S.sel.add(n.id); drawTree(); }
  else if (e.key === "Escape") { $("#detail")?.classList.remove("open"); palClose(); }
});
$("#pal").addEventListener("click", (e) => { const li = e.target.closest("li[data-pi]"); if (li) { palClose(); palRender.xs[+li.dataset.pi].go(); } else if (e.target.id === "pal") palClose(); });

/* ---------- start ---------- */
async function loadOrgs() {
  try { const r = await api("/api/orgs"); S.orgs = r.orgs || []; if (r.errors?.length) toast(t("Config errors") + ": " + r.errors[0]); } catch (e) { toast(e.message); }
  if (!orgOf()) S.org = S.orgs[0]?.id || "";
  if (!envOf()) S.env = orgOf()?.envs[0]?.env || "";
}
async function loadEnv() {
  S.runs = []; S.envd = null;
  if (!S.org || !S.env) return;
  try { S.envd = await api("/api/env?" + qs({ org: S.org, env: S.env })); S.runs = S.envd.runs || []; } catch {}
}
(async () => {
  document.documentElement.lang = LANG;
  try { S.scans = (await api("/api/session")).scans; } catch {}
  api("/api/db").then((d) => { S.db = d; renderSide(); if (d.updating) { S.dlStart = new Date().toISOString(); pollDB(); } }).catch(() => {});
  readURL();
  await loadOrgs();
  await loadEnv();
  if (S.run !== "current" && !S.runs.some((r) => r.run_id === S.run)) S.run = "current";
  if (!S.orgs.length || location.pathname.startsWith("/setup")) S.view = "setup";
  render();
  pollJobs();
})();
