<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kanareika</title>
<link rel="icon" type="image/png" href="/logo.png">
<style>

/* Tokens. One accent (canary), one cool-grey family, priority colors validated for CVD in both themes.
   Shape rule: controls 6, panels 10, chips and tags are pills. */
:root {
  --r-ctl: 6px; --r-panel: 10px; --r-pill: 999px;
  --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --ease: cubic-bezier(.23, 1, .32, 1);
}
:root, [data-theme="dark"] {
  /* the banner's world: blue-black, hairlines, canary accent, data in mono */
  --bg: #0b0d12; --surface: rgba(16,19,27,.82); --solid: #10131b; --raised: #161a24; --hover: rgba(255,255,255,.035); --sel: rgba(255,210,63,.09);
  --line: rgba(255,255,255,.07); --line-2: rgba(255,255,255,.12);
  --ink: #eceef5; --ink-2: #a3aabb; --ink-3: #6f778c;
  --accent: #ffd23f; --accent-ink: #0b0d12; --accent-line: #ffd23f;
  --host: #8fd8ff; --ok: #5fd4c4; --err: #ff5d6c;
  --p1: #ff5d6c; --p2: #ff9f43; --p3: #ffd23f; --p4: #7d8597;
  --shadow: 0 24px 64px rgba(0,0,0,.55);
  --aurora: radial-gradient(700px 420px at 100% 0%, rgba(130,100,255,.20), transparent 70%),
            radial-gradient(600px 380px at 100% 100%, rgba(255,190,60,.10), transparent 70%),
            radial-gradient(560px 340px at 0% 100%, rgba(60,200,190,.08), transparent 70%);
  --grid: rgba(160,175,210,.045);
  color-scheme: dark;
}
[data-theme="light"] {
  --bg: #f7f7f9; --surface: rgba(255,255,255,.9); --solid: #ffffff; --raised: #f1f2f6; --hover: rgba(11,13,18,.035); --sel: rgba(255,200,0,.14);
  --line: rgba(11,13,18,.08); --line-2: rgba(11,13,18,.14);
  --ink: #0b0d12; --ink-2: #4a5163; --ink-3: #6b7285;
  --accent: #ffd23f; --accent-ink: #0b0d12; --accent-line: #d9a800;
  --host: #0a6fa8; --ok: #13897a; --err: #d63a4a;
  --p1: #ff5d6c; --p2: #ff9f43; --p3: #ffd23f; --p4: #9aa1b2;
  --shadow: 0 24px 64px rgba(11,13,18,.14);
  --aurora: radial-gradient(700px 420px at 100% 0%, rgba(130,100,255,.10), transparent 70%),
            radial-gradient(600px 380px at 100% 100%, rgba(255,190,60,.10), transparent 70%);
  --grid: rgba(11,13,18,.035);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--aurora), var(--bg); background-attachment: fixed; color: var(--ink); font: 14px/1.45 var(--font); -webkit-font-smoothing: antialiased; overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent-line); outline-offset: 2px; }
code, .mono { font-family: var(--mono); font-size: 12.5px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: 240px minmax(0, 1fr); height: 100vh; }
.side { background-color: var(--solid); position: relative; isolation: isolate; border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.brand { display: flex; align-items: center; gap: 10px; padding: 16px 16px 12px; font-weight: 700; font-size: 17px; letter-spacing: -.03em; }
.brand img { filter: drop-shadow(0 4px 12px rgba(255,200,60,.35)); }
.brand kbd { margin-left: auto; }
.brand img { width: 22px; height: 22px; }
.scope { padding: 0 12px 12px; display: grid; gap: 8px; border-bottom: 1px solid var(--line); }
.orgbtn { display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 10px; background: var(--raised); border: 1px solid var(--line); border-radius: var(--r-ctl); text-align: left; }
.orgbtn b { font-weight: 600; } .orgbtn span { color: var(--ink-3); font-size: 12px; } .orgbtn svg { margin-left: auto; color: var(--ink-3); }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--raised); border: 1px solid var(--line); border-radius: var(--r-ctl); padding: 2px; }
.seg button { border: 0; background: none; padding: 5px 6px; border-radius: 4px; color: var(--ink-2); font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--line-2); }
.seg small { color: var(--ink-3); margin-left: 4px; }
nav.nav { padding: 10px 8px; display: grid; gap: 1px; overflow: auto; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: var(--r-ctl); color: var(--ink-2); text-decoration: none; position: relative; }
.nav a:hover { background: var(--hover); color: var(--ink); }
.nav a[aria-current="page"] { background: var(--raised); color: var(--ink); font-weight: 550; }
.nav a[aria-current="page"]::before { content: ""; position: absolute; left: -8px; top: 7px; bottom: 7px; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent-line); }
.nav a .n { margin-left: auto; font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.nav a .n.hot { color: var(--p1); font-weight: 600; }
.nav hr { border: 0; border-top: 1px solid var(--line); margin: 8px 2px; }
.status { margin-top: auto; padding: 12px; border-top: 1px solid var(--line); display: grid; gap: 8px; font-size: 12.5px; }
.status .row { display: flex; align-items: center; gap: 8px; color: var(--ink-2); }
.status .row b { color: var(--ink); font-weight: 550; }
.status .dot { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex: none; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: var(--r-ctl); border: 1px solid var(--line-2); background: var(--raised); color: var(--ink); white-space: nowrap; transition: background .12s var(--ease); }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.05); }
.btn.ghost { background: none; border-color: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--hover); color: var(--ink); }
.btn.icon { width: 32px; padding: 0; }
.protostate { font-size: 11.5px; color: var(--ink-3); display: grid; gap: 4px; }
.protostate select { background: var(--raised); border: 1px dashed var(--line-2); border-radius: var(--r-ctl); padding: 3px 6px; font-size: 12px; }

main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.top { display: flex; align-items: center; gap: 12px; padding: 14px 24px 0; }
.top h1 { font-size: 20px; letter-spacing: -.015em; margin: 0; font-weight: 650; }
.top .sub { color: var(--ink-2); font-size: 13px; }
.top .tools { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.select { height: 32px; padding: 0 10px; border: 1px solid var(--line-2); background: var(--raised); border-radius: var(--r-ctl); }
.mbar { display: none; }

/* ---------- ToDo ---------- */
.work { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 420px; }
.listcol { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.scroll { overflow: auto; min-height: 0; flex: 1; }
.rail { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; padding: 14px 24px 0; }
.pr { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-panel); padding: 10px 12px 8px; display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: end; transition: border-color .12s var(--ease), background .12s var(--ease); }
.pr:hover { border-color: var(--line-2); }
.pr[aria-pressed="true"] { border-color: var(--accent-line); background: var(--raised); }
.pr .lab { grid-column: 1 / -1; display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-2); }
.pr .lab i { width: 8px; height: 8px; border-radius: 2px; display: block; }
.pr .num { font-family: var(--mono); font-size: 26px; font-weight: 650; letter-spacing: -.02em; line-height: 1.1; font-variant-numeric: tabular-nums; }
.pr .due { grid-column: 1 / 2; font-size: 12px; color: var(--ink-3); }
.pr svg.spark { grid-row: 2 / 4; grid-column: 2; width: 84px; height: 30px; overflow: visible; }
.pr .zero { color: var(--ink-3); }
.toolbar { display: flex; gap: 8px; align-items: center; padding: 12px 24px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
.search { position: relative; flex: 0 1 280px; }
.search input { width: 100%; height: 32px; padding: 0 30px 0 32px; border-radius: var(--r-ctl); border: 1px solid var(--line-2); background: var(--surface); }
.search svg { position: absolute; left: 9px; top: 8px; color: var(--ink-3); }
.search kbd { position: absolute; right: 7px; top: 6px; }
kbd { font: 11px var(--mono); padding: 1px 5px; border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 4px; color: var(--ink-3); background: var(--surface); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { flex: none; white-space: nowrap; height: 28px; padding: 0 10px; border-radius: var(--r-pill); border: 1px solid var(--line-2); background: none; color: var(--ink-2); font-size: 12.5px; display: inline-flex; align-items: center; gap: 6px; }
.chip:hover { color: var(--ink); background: var(--hover); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip small { opacity: .7; font-variant-numeric: tabular-nums; }
.toolbar .right { margin-left: auto; display: flex; gap: 6px; align-items: center; color: var(--ink-3); font-size: 12.5px; }

.group { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 10px; padding: 14px 24px 6px; background: var(--bg); font-size: 12.5px; color: var(--ink-2); }
.group b { color: var(--ink); font-weight: 600; }
.group .gsel { margin-left: auto; }
.rows { list-style: none; margin: 0 16px; padding: 0; border: 1px solid var(--line); border-radius: var(--r-panel); background: var(--surface); overflow: hidden; }
.rowi { display: grid; grid-template-columns: 28px 30px minmax(0, 1fr) auto auto 64px; align-items: center; gap: 10px; padding: 0 12px 0 8px; min-height: 46px; border-top: 1px solid var(--line); cursor: pointer; position: relative; }
.rowi:first-child { border-top: 0; }
.rowi:hover { background: var(--hover); }
.rowi[aria-selected="true"] { background: var(--sel); }
.rowi[aria-selected="true"]::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--accent-line); }
.rowi.checked .cb { accent-color: var(--accent); }
.cb { width: 16px; height: 16px; accent-color: var(--accent); margin: 0 auto; cursor: pointer; }
.pb { font: 600 11px/1 var(--font); padding: 4px 0; width: 28px; text-align: center; border-radius: 4px; color: #0b0d12; font-family: var(--mono); }
.pb.P1 { background: var(--p1); } .pb.P2 { background: var(--p2); } .pb.P3 { background: var(--p3); } .pb.P4 { background: var(--p4); }
.t { min-width: 0; display: flex; align-items: baseline; gap: 8px; }
.t .title { font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.t .where { color: var(--ink-3); font-size: 12px; font-family: var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: none; max-width: 45%; }
.tags { display: flex; gap: 4px; }
.tag { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: var(--r-pill); border: 1px solid currentColor; white-space: nowrap; }
.tag.rce { color: var(--p1); } .tag.kev { color: var(--p2); } .tag.reboot { color: var(--ink-3); }
.cve { color: var(--ink-2); font-size: 12.5px; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; min-width: 52px; }
.cve b { color: var(--ink); font-weight: 600; }
.duec { text-align: right; color: var(--ink-3); font-size: 12.5px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.end { height: 96px; }
.empty { margin: 32px 24px; padding: 32px; border: 1px dashed var(--line-2); border-radius: var(--r-panel); text-align: center; color: var(--ink-2); }
.empty h3 { margin: 0 0 4px; color: var(--ink); font-size: 15px; }

.selbar { position: sticky; bottom: 16px; margin: 0 16px; display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 16px; background: var(--raised); border: 1px solid var(--line-2); border-radius: var(--r-panel); box-shadow: var(--shadow); transform: translateY(12px); opacity: 0; pointer-events: none; transition: transform .2s var(--ease), opacity .2s var(--ease); z-index: 3; }
.selbar.on { transform: none; opacity: 1; pointer-events: auto; }
.selbar .what { font-size: 13px; } .selbar .what b { font-weight: 650; }
.selbar .what span { color: var(--ink-3); margin-left: 6px; }
.selbar .acts { margin-left: auto; display: flex; gap: 6px; }

/* detail */
.detail { border-left: 1px solid var(--line); background: var(--solid); overflow: auto; min-height: 0; }
.dh { padding: 20px 24px 16px; border-bottom: 1px solid var(--line); }
.dh .meta { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-2); }
.dh h2 { margin: 10px 0 8px; font-size: 18px; line-height: 1.3; letter-spacing: -.01em; font-weight: 650; }
.dh .hosts { display: flex; flex-wrap: wrap; gap: 6px; }
.hchip { font-family: var(--mono); color: var(--host); display: inline-flex; gap: 6px; align-items: center; padding: 3px 9px; border-radius: var(--r-pill); background: var(--raised); border: 1px solid var(--line); font-size: 12.5px; }
.hchip span { color: var(--ink-3); font-family: var(--font); }
.back { display: none; }
.sec { padding: 16px 24px; border-bottom: 1px solid var(--line); }
.sec h4 { margin: 0 0 10px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-3); }
.why { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.why li { display: flex; gap: 8px; align-items: flex-start; }
.why li svg { margin-top: 2px; color: var(--ink-3); }
.why li.hot svg { color: var(--p1); }
table.pk { width: 100%; border-collapse: collapse; font-size: 13px; }
.pk th { text-align: left; font-weight: 500; color: var(--ink-3); font-size: 12px; padding: 0 0 6px; }
.pk code { color: var(--ink); }
.pk td { padding: 7px 0; border-top: 1px solid var(--line); vertical-align: top; }
.pk td.r, .pk th.r { text-align: right; }
.pk .ver { color: var(--ink-2); font-family: var(--mono); font-size: 12.5px; }
.pk .ver b { color: var(--ink); font-weight: 500; }
.cves { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 10px; }
.cves a { color: var(--ink-2); font: 12px var(--mono); text-decoration: none; border-bottom: 1px dotted var(--line-2); }
.cves a:hover { color: var(--ink); }
.cmd { display: flex; align-items: flex-start; gap: 8px; background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-ctl); padding: 10px 8px 10px 12px; }
.cmd code { flex: 1; white-space: pre-wrap; word-break: break-word; line-height: 1.5; }
.cmd .btn { height: 26px; }
.dfoot { padding: 16px 24px 24px; display: flex; gap: 8px; flex-wrap: wrap; }
.nodetail { padding: 48px 24px; color: var(--ink-3); text-align: center; }

/* overview / hosts */
.page { padding: 16px 24px 48px; overflow: auto; flex: 1; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-panel); }
.panel > header { display: flex; align-items: center; gap: 10px; padding: 14px 16px 0; }
.panel > header h3 { margin: 0; font-size: 14px; font-weight: 600; }
.panel > header .hint { color: var(--ink-3); font-size: 12.5px; }
.panel > header .right { margin-left: auto; display: flex; gap: 6px; }
.legend { display: flex; gap: 12px; font-size: 12.5px; color: var(--ink-2); }
.legend button { background: none; border: 0; padding: 0; display: inline-flex; gap: 6px; align-items: center; color: inherit; }
.legend button[aria-pressed="false"] { opacity: .4; }
.legend i { width: 10px; height: 10px; border-radius: 2px; display: block; }
.chart { position: relative; padding: 8px 16px 12px; }
.chart svg { display: block; max-width: 100%; }
.chart .gl { stroke: var(--line); } .chart .ax { fill: var(--ink-3); font-size: 11px; font-family: var(--font); }
.tip { position: absolute; pointer-events: none; background: var(--raised); border: 1px solid var(--line-2); border-radius: var(--r-ctl); box-shadow: var(--shadow); padding: 8px 10px; font-size: 12.5px; min-width: 130px; display: none; z-index: 5; }
.tip .r { display: flex; align-items: center; gap: 6px; } .tip .r b { margin-left: auto; font-variant-numeric: tabular-nums; }
.tip i { width: 8px; height: 8px; border-radius: 2px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; margin-top: 16px; }
.lines { list-style: none; margin: 0; padding: 8px 16px 14px; display: grid; gap: 0; }
.lines li { padding: 9px 0; border-top: 1px solid var(--line); display: flex; gap: 10px; font-size: 13px; }
.lines li:first-child { border-top: 0; }
.lines li span { color: var(--ink-3); margin-left: auto; white-space: nowrap; }
table.ht { width: 100%; border-collapse: collapse; font-size: 13px; }
.ht th { text-align: left; font-weight: 500; color: var(--ink-3); font-size: 12px; padding: 12px 12px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.ht td b { font-family: var(--mono); color: var(--host); font-weight: 500; }
.ht td { padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.ht tr:last-child td { border-bottom: 0; }
.ht tbody tr { cursor: pointer; } .ht tbody tr:hover { background: var(--hover); }
.ht .num { text-align: right; font-variant-numeric: tabular-nums; }
.ht .z { color: var(--ink-3); }
.ht .os { color: var(--ink-2); max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
.tablewrap { overflow-x: auto; }
.lead { font-size: 15px; color: var(--ink-2); margin: 4px 0 0; }
.lead b { color: var(--ink); }

/* states */
.banner { margin: 12px 24px 0; padding: 10px 14px; border-radius: var(--r-panel); border: 1px solid var(--line-2); background: var(--raised); display: flex; gap: 12px; align-items: center; font-size: 13px; }
.banner .bar { flex: 1; max-width: 240px; height: 4px; background: var(--line-2); border-radius: 2px; overflow: hidden; }
.banner .bar i { display: block; height: 100%; width: 57%; background: var(--accent-line); }
.banner.err { border-color: color-mix(in srgb, var(--err) 50%, var(--line)); }
.banner.err svg { color: var(--err); }
.onb { max-width: 560px; margin: 48px auto; padding: 0 24px; }
.onb h2 { font-size: 22px; letter-spacing: -.015em; margin: 0 0 6px; }
.onb p { color: var(--ink-2); margin: 0 0 20px; }
.steps { list-style: none; padding: 0; margin: 0 0 20px; border: 1px solid var(--line); border-radius: var(--r-panel); background: var(--surface); }
.steps li { display: flex; gap: 12px; padding: 14px 16px; border-top: 1px solid var(--line); align-items: flex-start; }
.steps li:first-child { border-top: 0; }
.steps .ok { color: var(--ok); } .steps small { display: block; color: var(--ink-3); }
.sk { background: linear-gradient(90deg, var(--raised), var(--hover), var(--raised)); background-size: 200% 100%; animation: sk 1.2s linear infinite; border-radius: 4px; height: 12px; }
@keyframes sk { to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) { .sk { animation: none; } .selbar, .btn, .pr { transition: none; } }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 16px); opacity: 0; background: var(--ink); color: var(--bg); padding: 9px 14px; border-radius: var(--r-ctl); font-size: 13px; transition: .2s var(--ease); z-index: 50; pointer-events: none; }
.toast.on { transform: translate(-50%, 0); opacity: 1; }
.menu { position: absolute; z-index: 40; background: var(--raised); border: 1px solid var(--line-2); border-radius: var(--r-ctl); box-shadow: var(--shadow); padding: 4px; min-width: 200px; }
.menu button { display: flex; width: 100%; gap: 8px; align-items: center; padding: 7px 10px; border: 0; background: none; border-radius: 4px; text-align: left; }
.menu button:hover { background: var(--hover); }
.menu .sep { border-top: 1px solid var(--line); margin: 4px 0; }
.menu small { color: var(--ink-3); margin-left: auto; }
dialog { border: 1px solid var(--line-2); border-radius: var(--r-panel); background: var(--surface); color: var(--ink); padding: 0; width: min(640px, calc(100vw - 32px)); box-shadow: var(--shadow); }
dialog::backdrop { background: rgba(0,0,0,.5); }
dialog header { padding: 16px 20px; border-bottom: 1px solid var(--line); display: flex; align-items: center; }
dialog header h3 { margin: 0; font-size: 16px; }
dialog header .btn { margin-left: auto; }
dialog .body { padding: 8px 20px 20px; max-height: 60vh; overflow: auto; }
dialog ol { padding-left: 18px; } dialog li { margin: 10px 0; }
dialog footer { padding: 12px 20px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; }
.note { color: var(--ink-3); font-size: 12px; }


.t .title code { font-size: 13px; color: var(--ink); font-weight: 500; }
.t .title .arr { color: var(--ink-3); }

.seg3 button[aria-checked="true"] { background: var(--solid); color: var(--ink); box-shadow: 0 0 0 1px var(--line-2); }
.prefs { display: none; }



/* page: onboarding, checks, job output, due box */
.onb { max-width: 760px; margin: 32px auto; padding: 0 24px 48px; }
.onb h2 { font-size: 22px; letter-spacing: -.015em; margin: 18px 0 6px; }
.onb p { color: var(--ink-2); margin: 0 0 16px; }
.steps2 { display: flex; gap: 10px; align-items: center; color: var(--ink-3); font-size: 13px; flex-wrap: wrap; }
.steps2 span { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--line-2); font: 600 12px var(--mono); }
.steps2 span.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.steps2 span.done { color: var(--ok); border-color: var(--ok); }
.steps2 b { font-weight: 500; margin-right: 10px; } .steps2 span.on + b { color: var(--ink); }
.form { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; }
.form label, .form fieldset { display: grid; gap: 6px; font-size: 13px; color: var(--ink-2); margin: 0; }
.form .wide { grid-column: 1 / -1; }
.form label > span { display: flex; gap: 8px; align-items: baseline; color: var(--ink); font-weight: 500; }
.form small { color: var(--ink-3); font-weight: 400; }
.form input:not([type]), .form input[name], .form textarea { font: 13px var(--mono); padding: 8px 10px; border: 1px solid var(--line-2); border-radius: var(--r-ctl); background: var(--solid); color: var(--ink); }
.form input[type=radio], .form input[type=checkbox] { width: auto; }
.form textarea { resize: vertical; line-height: 1.5; }
.form fieldset { border: 1px solid var(--line); border-radius: var(--r-ctl); padding: 8px 12px 10px; }
.form legend { color: var(--ink); font-weight: 500; padding: 0 4px; }
.form .radio, .form .check { display: flex; gap: 8px; align-items: center; color: var(--ink-2); }
.form .check { color: var(--ink); }
.actions { display: flex; gap: 8px; margin-top: 8px; }
.banner ul { margin: 0; padding-left: 18px; }
.st.bad { color: var(--err); }
.checks td { vertical-align: top; }
.jobout pre { background: var(--solid); border: 1px solid var(--line); border-radius: var(--r-ctl); padding: 12px; font: 12px/1.5 var(--mono); white-space: pre-wrap; max-height: 360px; overflow: auto; }
.duebox .big { font: 600 18px var(--mono); }
.duebox .late { color: var(--p1); }
.cnt { display: inline-flex; gap: 6px; align-items: center; font: 12.5px var(--mono); color: var(--ink-2); padding: 4px 8px; }
.cnt i { width: 9px; height: 9px; border-radius: 2px; display: block; } .cnt b { color: var(--ink); }
.dot.warn { background: var(--p2); box-shadow: 0 0 8px var(--p2); }

@media (max-width: 720px) { .form { grid-template-columns: 1fr; } }

/* extra-css */
.onb.wide { max-width: 900px; }

.pathcard { text-align: left; display: grid; align-content: start; justify-items: start; gap: 8px; padding: 18px; border: 1px solid var(--line-2); border-radius: var(--r-panel); background: var(--solid); color: var(--ink); cursor: pointer; }

.form details > summary::after { content: "›"; font-size: 15px; transition: transform .15s var(--ease); }
.form details[open] > summary::after { transform: rotate(90deg); }
.form details > summary:hover { color: var(--ink); }
.form details summary small { color: var(--ink-3); margin-left: 8px; font-family: var(--mono); }
.form .inner { margin-top: 12px; }

.btn.small.left { margin-left: 0; }
.understood { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 4px; }
.understood li { display: flex; gap: 8px; align-items: center; font-size: 13px; }
.understood li svg { color: var(--ok); width: 14px; height: 14px; }
.skipped { display: flex; gap: 10px; margin-top: 10px; padding: 10px 12px; border: 1px solid color-mix(in srgb, var(--p2) 45%, var(--line)); border-radius: var(--r-ctl); font-size: 13px; }
.skipped svg { color: var(--p2); flex: none; margin-top: 2px; }

/* onboarding: stepper and the vulnerability-list line */

.onbwrap.roomy { max-width: 920px; }

.stepper { list-style: none; margin: 0 0 32px; padding: 0; display: flex; align-items: center; max-width: 560px; }
.stepper li { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
.stepper li + li { flex: 1; }
.stepper li + li::before { content: ""; flex: 1; height: 2px; margin: 0 6px; border-radius: 2px; background: var(--line-2); }
.stepper li.done + li::before, .stepper li.done + li.done::before { background: var(--ok); }
.stepper li.on:not(:first-child)::before { background: linear-gradient(90deg, var(--ok), var(--accent)); }
.stepper .dotn { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font: 600 12.5px var(--mono); color: var(--ink-3);
  border: 1.5px solid var(--line-2); background: var(--solid); transition: box-shadow .2s var(--ease); }
.stepper .dotn svg { width: 14px; height: 14px; }
.stepper li.on .dotn { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); box-shadow: 0 0 0 4px color-mix(in oklab, var(--accent) 22%, transparent); }
.stepper li.done .dotn { background: color-mix(in oklab, var(--ok) 14%, var(--solid)); border-color: var(--ok); color: var(--ok); }
.stepper b { font-size: 13.5px; font-weight: 600; color: var(--ink-3); }
.stepper li.on b, .stepper li.done b { color: var(--ink); }
.dlline { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 28px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 13px; color: var(--ink-2); }
.dlline:empty { display: none; }
.dlline > svg { flex: none; width: 16px; height: 16px; color: var(--ink-3); }
.dlline > span { flex: 1; min-width: 220px; } .dlline b { color: var(--ink); font-family: var(--mono); font-weight: 600; }
.dlline.ok > svg { color: var(--ok); } .dlline.bad > svg { color: var(--err); }
.dlline .bar { flex-basis: 100%; height: 3px; border-radius: 3px; background: var(--line); overflow: hidden; }
.dlline .bar i { display: block; height: 100%; width: 35%; border-radius: 3px; background: var(--accent); animation: dlbar 1.4s var(--ease) infinite; }
@keyframes dlbar { from { transform: translateX(-100%); } to { transform: translateX(300%); } }
@media (prefers-reduced-motion: reduce) { .dlline .bar i { animation: none; width: 100%; opacity: .5; } }
@media (max-width: 640px) { .stepper li:not(.on) b { display: none; } .onbwrap { padding: 0 16px 40px; margin-top: 20px; } }

#pastebox { resize: vertical; overflow: auto; min-height: 84px; }
.understood.skip li { color: var(--ink-3); } .understood.skip svg { color: var(--p2); }
.causes { display: grid; gap: 10px; margin: 4px 0 14px; }
.cause { display: grid; grid-template-columns: 18px 1fr; gap: 10px; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r-panel); background: var(--solid); }
.cause > svg, .cause > .spin { width: 16px; height: 16px; margin-top: 2px; color: var(--err); }
.cause.good > svg { color: var(--ok); }
.cause b { font-weight: 500; font-size: 13.5px; line-height: 1.45; display: block; }
.cause .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.cause .chips code { font: 12px var(--mono); padding: 2px 8px; border-radius: var(--r-pill); background: var(--sel); color: var(--host); white-space: nowrap; }
.cause details.raw { margin-top: 8px; font-size: 12px; } .cause details.raw summary { cursor: pointer; color: var(--ink-3); }
.cause details.raw code { display: block; margin-top: 6px; font: 11.5px var(--mono); color: var(--ink-3); white-space: pre-wrap; word-break: break-word; }
code.copyable { cursor: copy; font-family: var(--mono); color: var(--ink); border-bottom: 1px dashed var(--line-2); }
.btn[disabled] { opacity: .45; cursor: not-allowed; filter: saturate(.4); }
/* host names and addresses never break across lines */
.hostn, .tbl td.mono, .tbl.preview td, .understood code, .cause .chips code, code.from, code.to, .pick b { white-space: nowrap; }
.tbl.preview { display: block; overflow-x: auto; }

/* end-extra-css */
</style>

<script>
"use strict";
/* Kanareika dashboard. Data: /api/orgs, /api/env, /api/tree, /api/node, /api/prompt, /api/jobs, /api/db; first run:
   /api/setup, /api/setup/check, /api/scan. The TUI shows the same nodes from the same API. */
const CSRF = /*CSRF*/"";
const UI = /*I18N_UI*/{};
const LANG_NAMES = /*I18N_NAMES*/{};
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const icon = (n) => `<svg class="i" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const store = {
  get(k, d) { try { return localStorage.getItem("kanareika." + k) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("kanareika." + k, v); } catch {} },
};
const LANG = new URLSearchParams(location.search).get("lang") || store.get("lang", "en");
const t = (s, args) => {
  let out = (UI[LANG] && UI[LANG][s]) || s;
  if (args) for (const [k, v] of Object.entries(args)) out = out.replaceAll("{" + k + "}", v);
  return out;
};

async function api(path) {
  const r = await fetch(path, { cache: "no-store" });
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(body.error || r.statusText), { status: r.status, body });
  return body;
}
async function post(path, data) {
  const r = await fetch(path, { method: "POST", cache: "no-store", headers: { "Content-Type": "application/json", "X-Kanareika-CSRF": CSRF }, body: JSON.stringify(data || {}) });
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(body.error || r.statusText), { status: r.status, body });
  return body;
}

/* ---------- state ---------- */
const S = {
  orgs: [], org: store.get("org", ""), env: store.get("env", ""), run: "current", runs: [],
  view: "todo", by: store.get("by", "fix"), flt: new Set(), q: "", open: new Set(), cur: null, stack: [], sel: new Set(),
  tree: null, theme: store.get("theme", "system"), scans: false, db: null, jobs: [], setup: null,
};
const today = () => new Date().toISOString().slice(0, 10);
const days = (d) => Math.round((new Date(d + "T00:00:00Z") - new Date(today() + "T00:00:00Z")) / 864e5);
const fmtDay = (d) => new Date(d + "T00:00:00Z").toLocaleDateString(LANG, { day: "numeric", month: "short", timeZone: "UTC" });
const dueText = (d) => { if (!d) return ""; const n = days(d); return n < 0 ? t("{n} d late", { n: -n }) : n < 14 ? t("in {n} d", { n }) : fmtDay(d); };
const pct = (e) => (e >= 0.1 ? Math.round(e * 100) + "%" : e >= 0.01 ? (e * 100).toFixed(1) + "%" : e > 0 ? "<1%" : "");
const ago = (iso) => {
  if (!iso) return t("never");
  const h = (Date.now() - new Date(iso).getTime()) / 36e5;
  return h < 1 ? t("just now") : h < 48 ? t("{n} h ago", { n: Math.round(h) }) : t("{n} d ago", { n: Math.round(h / 24) });
};
const qs = (o) => Object.entries(o).filter(([, v]) => v !== "" && v != null).map(([k, v]) => k + "=" + encodeURIComponent(v)).join("&");
const scope = () => ({ org: S.org, env: S.env, run: S.run });

/* ---------- theme ---------- */
const darkMQ = matchMedia("(prefers-color-scheme: dark)");
function applyTheme() { document.documentElement.dataset.theme = S.theme === "system" ? (darkMQ.matches ? "dark" : "light") : S.theme; }
darkMQ.addEventListener("change", applyTheme);
applyTheme();

/* ---------- sidebar ---------- */
const NAV = [["todo", "ToDo", "list"], ["hosts", "Hosts", "server"], ["changes", "Changes", "diff"], ["access", "Access", "key"],
  ["network", "Network", "globe"], ["health", "Health", "heart"], ["exceptions", "Exceptions", "shield"], "-", ["runs", "Runs and log", "clock"]];
const orgOf = () => S.orgs.find((o) => o.id === S.org);
const envOf = () => orgOf()?.envs.find((e) => e.env === S.env);

function sel(id, label, opts, cur) {
  return `<label class="srow"><span class="sl">${label}</span><select id="${id}" aria-label="${label}">${opts.map(([v, txt]) =>
    `<option value="${esc(v)}" ${v === cur ? "selected" : ""}>${esc(txt)}</option>`).join("")}</select>${icon("chev")}</label>`;
}
function renderSide() {
  const o = orgOf(), e = envOf();
  const orgOpts = S.orgs.map((x) => [x.id, x.name || x.id]);
  if (S.scans) orgOpts.push(["__new", "+ " + t("Add servers…")]);
  $("#scope").innerHTML = S.orgs.length ? sel("org", t("Org"), orgOpts, S.org) +
    sel("env", t("Env"), (o?.envs || []).map((x) => [x.env, `${x.env} · ${x.hosts}${x.last ? "" : " · " + t("no scans")}`]), S.env) +
    sel("run", t("Data"), [["current", t("Current state")], ...S.runs.slice(-20).reverse().map((r) => [r.run_id, r.run_id.replace("_", " ").replace(/(\d\d)(\d\d)(\d\d)$/, "$1:$2") + (r.partial ? " · " + t("partial") : "")])], S.run) : "";
  if (!S.orgs.length || S.view === "setup" && !envOf()?.last) {
    $("#nav").innerHTML = NAV.map((n) => n === "-" ? "<hr>" : `<a class="off" aria-disabled="true" title="${t("Available after the first scan")}">${icon(n[2])}${t(n[1])}</a>`).join("") +
      `<div class="navnote">${t("Available after the first scan")}</div>`;
  } else $("#nav").innerHTML = S.orgs.length ? NAV.map((n) => n === "-" ? "<hr>" :

    `where: ${d.where.map((w) => `${w.group} (${w.hosts.join(", ")})`).join("; ")}`];

  lines.push(`MCP: get_fix org=${S.org} env=${S.env} id=${n.id}`);
  return lines.join("\n");
}

  const skipped = (s.skipped || []).length ? `<ul class="understood skip">${s.skipped.map((x) => `<li>${icon("alert")}<span>${esc(x)} · ${t("skipped")}</span></li>`).join("")}</ul>` : "";
  const file = s.file ? `<p class="note">${t("Addresses and logins are saved in {file}.", { file: `<code class="copyable" data-copy-text="${esc(s.file)}" title="${esc(s.file)} · ${t("click to copy")}">${esc(s.file.split("/").pop())}</code>` })}</p>` : "";
  const dl = dlNeeded() && !S.db?.updating ? `<span class="note">${t("downloads {size} first", { size: bytes(dlTotal()) })}</span>` : "";
  const actions = waiting.length ? "" : ok.length
    ? `<button class="btn primary" data-setup-scan>${bad.length ? t("Scan the {n} that answered", { n: ok.length }) : t("Start the first scan")}</button>${bad.length ? `<button class="btn" data-setup-recheck>${t("Check the failed again")}</button>` : ""}${dl}`
    : `<button class="btn primary" data-setup-recheck>${t("Check again")}</button>`;
  return `<div class="onb"><h2>${t("Access check")}</h2>
    <p>${t("Kanareika logs in to each server and runs uname -sr. Nothing is changed.")}</p>
    <div class="causes">${waitHTML}${causeHTML}${okHTML}</div>${skipped}${file}
    <div class="actions">${actions}</div></div>`;
}
let checkTick;
async function checkAccess(onlyFailed) {
  const s = S.setup;
  if (!s.hosts) {
    try { const e = await api("/api/env?" + qs({ org: s.org, env: s.env })); s.hosts = (e.hosts || []).filter((h) => !s.only || s.only.includes(h.name)).map((h) => ({ name: h.name, address: h.address })); }
    catch { s.hosts = []; }
  }
  s.res ||= {};
  const todo = s.hosts.filter((h) => !onlyFailed || (s.res[h.name] && !s.res[h.name].ok));
  todo.forEach((h) => delete s.res[h.name]);
  s.started = Date.now();
  clearInterval(checkTick);
  checkTick = setInterval(() => { if (S.view === "setup" && S.setup?.step === 2) $("#view").innerHTML = setupView(); else clearInterval(checkTick); }, 1000);
  render();
  let i = 0;
  const worker = async () => {
    while (i < todo.length) {
      const h = todo[i++];
      try { const r = await post("/api/setup/check", { org: s.org, env: s.env, hosts: [h.name] }); s.res[h.name] = r.results[0] || { ok: false, error: t("no answer") }; }
      catch (e) { s.res[h.name] = { ok: false, error: e.message }; }
      if (S.view === "setup") $("#view").innerHTML = setupView();
    }
  };
  await Promise.all(Array.from({ length: Math.min(8, todo.length) }, worker));
  clearInterval(checkTick);
  s.results = s.hosts.map((h) => ({ host: h.name, ...s.res[h.name] }));
  if (S.view === "setup") $("#view").innerHTML = setupView();
}

/* ---------- scans ---------- */
async function startScan(org, env) {
  try { const r = await post("/api/scan", { org, env }); toast(t("Scan started")); pollJobs(); return r.id; }
  catch (e) { toast(e.message); return null; }
}
let polling = null;
async function pollJobs() {
  clearTimeout(polling);
  try { S.jobs = (await api("/api/jobs")).jobs || []; } catch { return; }
  const running = S.jobs.some((j) => j.state === "running");
  if (S.view === "setup") $("#view").innerHTML = setupView();
  banner();
  if (running) polling = setTimeout(pollJobs, 1500);
  else if (S.wasRunning) { S.wasRunning = false; await loadOrgs(); if (S.view === "todo") loadTree(); }
  S.wasRunning ||= running;
}
function banner() {
  const j = S.jobs.find((x) => x.state === "running" && x.request.org === S.org && x.request.env === S.env);
  const el = $("#banner"); if (!el) return;
  el.innerHTML = j ? `<div class="banner">${icon("scan")}<span><b>${t("Scanning {env}", { env: esc(S.env) })}</b> · ${esc((j.output || []).slice(-1)[0] || "")}</span><button class="btn ghost" data-cancel="${j.id}">${t("Cancel")}</button></div>` : "";
}

/* ---------- views ---------- */
function noRuns() {
  return `<div class="onb"><h2>${t("No scans of {env} yet", { env: esc(S.env) })}</h2><p>${t("Kanareika connects to the servers over SSH, reads what is installed and how they are set up, and changes nothing.")}</p>
    ${S.scans ? `<div class="actions"><button class="btn primary" data-scan-now>${icon("scan")}${t("Start the first scan")}</button></div>` : `<p class="note">${t("Scans are started where kanareika web runs on localhost (or with a token).")}</p>`}</div>`;
}
function render() {
  renderSide();
  if (S.view === "setup" || !S.orgs.length) { S.view = "setup"; $("#view").innerHTML = setupView(); return; }
  $("#view").innerHTML = `<div id="banner"></div>` + todoShell();
  banner(); loadTree();
}
function toast(msg) { const el = $("#toast"); el.textContent = msg; el.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("on"), 2600); }
async function copy(text, what) { try { await navigator.clipboard.writeText(text); toast(what || t("Copied")); } catch { toast(t("Copy failed: select and copy by hand")); } }

/* ---------- ⌘K ---------- */
let PI = 0;
function palItems(q) {
  q = q.trim().toLowerCase();
  const it = [];
  const walk = (ns, depth) => ns.forEach((n) => { if (n.kind !== "section") it.push({ g: depth ? t("Inside") : t("Fixes"), label: `${n.priority} · ${n.label}${n.fixed ? " → " + n.fixed : ""}`, hint: n.hosts ? t("{n} hosts", { n: n.hosts }) : "", go: () => { S.view = "todo"; show(n.id); } }); if (depth < 2) walk(n.kids || [], depth + 1); });
  walk(S.tree?.nodes || [], 0);
  NAV.filter((n) => n !== "-").forEach((n) => it.push({ g: t("Go to"), label: t(n[1]), hint: "", go: () => { if (n[0] === "todo") { S.view = "todo"; render(); } else location.href = "/classic#" + qs({ org: S.org, env: S.env }); } }));
  [["fix", "Group by fix"], ["cve", "Group by CVE"], ["host", "Group by host"]].forEach(([k, l]) => it.push({ g: t("Commands"), label: t(l), hint: "", go: () => { S.by = k; store.set("by", k); S.open.clear(); S.cur = null; render(); } }));
  if (S.scans && S.env) it.push({ g: t("Commands"), label: t("Scan {env}", { env: S.env }), hint: "", go: () => startScan(S.org, S.env) });
  if (S.scans) it.push({ g: t("Commands"), label: t("Add servers…"), hint: "", go: () => { S.setup = null; S.view = "setup"; render(); } });
  return (q ? it.filter((x) => x.label.toLowerCase().includes(q)) : it.filter((x) => x.g !== t("Inside"))).slice(0, 50);
}
function palRender() {
  const xs = palItems($("#palq").value); PI = Math.min(PI, Math.max(0, xs.length - 1)); let g = "";
  $("#pall").innerHTML = xs.map((x, i) => (x.g !== g ? `<div class="grp">${esc((g = x.g))}</div>` : "") + `<li role="option" data-pi="${i}" aria-selected="${i === PI}">${esc(x.label)}<small>${esc(x.hint)}</small></li>`).join("") || `<div class="grp">${t("Nothing found")}</div>`;
  palRender.xs = xs; $("#pall li[aria-selected=true]")?.scrollIntoView({ block: "nearest" });
}
function palOpen() { $("#pal").classList.add("on"); $("#palq").value = ""; PI = 0; palRender(); $("#palq").focus(); }
function palClose() { $("#pal").classList.remove("on"); }

/* ---------- events ---------- */
document.addEventListener("click", async (e) => {
  const el = e.target.closest(".hc, button, a, .node, tr.link, [data-goto], [data-copy-text], input"); if (!el) return;
  const d = el.dataset;
  if (d.themeSet) { S.theme = d.themeSet; store.set("theme", S.theme); applyTheme(); renderSide(); return; }
  if (d.view) { if (d.view === "todo") { e.preventDefault(); S.view = "todo"; render(); } return; }
  if (d.tw) { e.stopPropagation(); S.open.has(d.tw) ? S.open.delete(d.tw) : S.open.add(d.tw); const sc = $("#scroll").scrollTop; drawTree(); $("#scroll").scrollTop = sc; return; }
  if (d.sel) { e.stopPropagation(); S.sel.has(d.sel) ? S.sel.delete(d.sel) : S.sel.add(d.sel); drawSelbar(); return; }
  if (el.classList.contains("node") || el.classList.contains("hc")) { if (d.n) show(d.n); return; }
  if (d.goto) { show(d.goto, true); return; }
  if ("back" in d) { const p = S.stack.pop(); if (p) { S.cur = p.id; DETAIL = await api("/api/node?" + qs({ ...scope(), by: S.by, f: [...S.flt].join(","), q: S.q, id: p.id })); $("#detail").innerHTML = detailHTML(DETAIL); } return; }
  if (d.by) { S.by = d.by; store.set("by", d.by); S.open.clear(); S.cur = null; S.stack = []; render(); return; }
  if (d.flt) { S.flt.has(d.flt) ? S.flt.delete(d.flt) : S.flt.add(d.flt); el.setAttribute("aria-pressed", S.flt.has(d.flt)); loadTree(); return; }
  if ("bp" in d) { S.backport = !S.backport; loadTree(); return; }
  if ("expand" in d) { const all = (ns) => ns.forEach((n) => { if ((n.kids || []).length) { S.open.add(n.id); all(n.kids); } }); all(S.tree?.nodes || []); render(); return; }
  if ("collapse" in d) { S.open.clear(); render(); return; }
  if ("clear" in d) { S.sel.clear(); drawTree(); return; }
  if ("reset" in d) { S.flt.clear(); S.q = ""; render(); return; }
  if (d.addsel) { S.sel.has(d.addsel) ? S.sel.delete(d.addsel) : S.sel.add(d.addsel); drawTree(); $("#detail").innerHTML = detailHTML(DETAIL); return; }
  if ("copytask" in d) { try { const r = await api("/api/prompt?" + qs({ ...scope(), lang: LANG, nodes: [...S.sel].join(",") })); copy(r.text, t("Task copied: paste it into your agent")); } catch (er) { toast(er.message); } return; }
  if (d.copytext) { copy(d.copytext); return; }
  if (d.copyctx && DETAIL) { copy(context(DETAIL), t("Context copied: paste it into your agent")); return; }
  if ("close" in d) { $("#detail").classList.remove("open"); return; }
  if (d.cancel) { try { await post(`/api/jobs/${d.cancel}/cancel`); } catch (er) { toast(er.message); } return; }
  if (el.id === "scanbtn" || "scanNow" in d) { await startScan(S.org, S.env); return; }
  if (el.id === "cmdk") { palOpen(); return; }
  if ("setupCancel" in d) { S.view = "todo"; render(); return; }
  if (d.path !== undefined && el.classList.contains("pathcard") || (d.path === "" && el.tagName === "BUTTON")) { S.setup = { step: d.path ? 1 : 0, path: d.path }; await discover(); render(); return; }
  if ("formats" in d) { const f = $("#formats"); f.hidden = !f.hidden; return; }
  if ("sshpick" in d) { await discover(); sshPicker(); return; }
  if ("pickclose" in d) { $("#dlg").close(); return; }
  if ("pickadd" in d) {
    const dd = await discover(), ta = $("#pastebox");
    const hs = [...document.querySelectorAll("#picklist input:checked")].map((c) => dd.hosts[+c.value]);
    $("#dlg").close();
    if (hs.length) { ta.value = (ta.value.trim() ? ta.value.trim() + "\n" : "") + hs.map((h) => sshLine(h, dd)).join("\n"); preview(); }
    return;
  }
  if (d.sshhost !== undefined || "sshall" in d) {
    const dd = await discover(), ta = $("#pastebox");
    const hs = "sshall" in d ? dd.hosts : [dd.hosts[+d.sshhost]];
    ta.value = (ta.value.trim() ? ta.value.trim() + "\n" : "") + hs.map((h) => sshLine(h, dd)).join("\n");
    preview(); return;
  }
  if ("importSsh" in d) { const dd = await discover(); const ta = $("#fleetform textarea[name=hosts]"); ta.value = (ta.value.trim() ? ta.value.trim() + "\n" : "") + dd.hosts.map((h) => `${h.alias.toLowerCase().replace(/[^a-z0-9_-]+/g, "-")} ${(h.hostname || h.alias)}${h.port ? ":" + h.port : ""}`).join("\n"); return; }
  if ("dlStart" in d) {
    S.setup ||= { step: 0, path: "" }; S.setup.dlAsked = true; S.setup.dlLater = false;
    try { await post("/api/db/update", {}); } catch (er) { if (!/already running/.test(er.message)) { toast(er.message); return; } }
    S.dlStart = new Date().toISOString(); pollDB(); return;
  }
  if ("copyText" in d) { copy(d.copyText, t("Path copied")); return; }
  if ("setupRecheck" in d) { const s = S.setup; checkAccess(Object.values(s.res || {}).some((r) => !r.ok)); return; }
  if ("setupScan" in d) {
    const s = S.setup; await loadOrgs(); S.org = s.org; S.env = s.env; store.set("org", S.org); store.set("env", S.env);
    const ok = (s.results || []).filter((x) => x.ok).map((x) => x.host), all = (s.results || []).length;
    try { const r = await post("/api/scan", { org: s.org, env: s.env, hosts: ok.length < all || s.only ? ok : undefined }); s.job = r.id; pollJobs(); } catch (er) { toast(er.message); return; }
    s.step = 3; render(); return;
  }
  if ("setupDone" in d) { S.setup = null; S.view = "todo"; await loadOrgs(); render(); return; }
});
document.addEventListener("submit", (e) => {
  if (e.target.id === "fewform") { e.preventDefault(); submitFew(e.target); }
  else if (e.target.id === "fleetform") { e.preventDefault(); submitFleet(e.target); }
  else if (e.target.id === "clientform") { e.preventDefault(); submitClient(e.target); }
});
document.addEventListener("change", async (e) => {
  const id = e.target.id, v = e.target.value;
  if (id === "org") {
    if (v === "__new") { S.setup = null; S.view = "setup"; render(); return; }
    S.org = v; store.set("org", v); S.env = orgOf()?.envs[0]?.env || ""; store.set("env", S.env); S.run = "current"; S.cur = null; await loadEnv(); render();
  } else if (id === "env") { S.env = v; store.set("env", v); S.run = "current"; S.cur = null; await loadEnv(); render(); }
  else if (id === "run") { S.run = v; S.cur = null; render(); }
  else if (id === "lang") { store.set("lang", v); const u = new URL(location.href); u.searchParams.delete("lang"); location.href = u; }
});
let qTimer;
document.addEventListener("input", (e) => {
  if (e.target.id === "pickq") { const q = e.target.value.toLowerCase(); document.querySelectorAll("#picklist .pick").forEach((l) => (l.hidden = !l.dataset.alias.includes(q) && !l.textContent.toLowerCase().includes(q))); return; }
  if (e.target.id === "pastebox") grow(e.target);
  if (e.target.id === "pastebox" || e.target.name === "user") { clearTimeout(previewTimer); previewTimer = setTimeout(preview, 250); }
  if (e.target.id === "q") { S.q = e.target.value; clearTimeout(qTimer); qTimer = setTimeout(loadTree, 200); } else if (e.target.id === "palq") { PI = 0; palRender(); } });
document.addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); palOpen(); return; }
  if (e.target.id === "palq") {
    if (e.key === "ArrowDown") { PI = Math.min(PI + 1, palRender.xs.length - 1); palRender(); e.preventDefault(); }
    else if (e.key === "ArrowUp") { PI = Math.max(0, PI - 1); palRender(); e.preventDefault(); }
    else if (e.key === "Enter") { const x = palRender.xs[PI]; palClose(); x?.go(); }
    else if (e.key === "Escape") palClose();
    return;
  }
  if (e.target.matches("input, select, textarea")) { if (e.key === "Escape") e.target.blur(); return; }
  if (S.view !== "todo") return;
  const i = FLAT.findIndex((n) => n.id === S.cur), n = FLAT[i];
  const go = (m) => { if (!m) return; show(m.id); document.querySelector(`.node[data-n="${CSS.escape(m.id)}"]`)?.scrollIntoView({ block: "nearest" }); };
  if (e.key === "/") { e.preventDefault(); $("#q")?.focus(); }
  else if (e.key === "j" || e.key === "ArrowDown") { e.preventDefault(); go(FLAT[i + 1]); }
  else if (e.key === "k" || e.key === "ArrowUp") { e.preventDefault(); go(FLAT[i - 1]); }
  else if ((e.key === "l" || e.key === "ArrowRight") && (n?.kids || []).length) { S.open.add(n.id); drawTree(); }
  else if (e.key === "h" || e.key === "ArrowLeft") { if (n && S.open.has(n.id)) { S.open.delete(n.id); drawTree(); } }
  else if ((e.key === "x" || e.key === " ") && n) { e.preventDefault(); S.sel.has(n.id) ? S.sel.delete(n.id) : S.sel.add(n.id); drawTree(); }
  else if (e.key === "Escape") { $("#detail")?.classList.remove("open"); palClose(); }
});
$("#pal").addEventListener("click", (e) => { const li = e.target.closest("li[data-pi]"); if (li) { palClose(); palRender.xs[+li.dataset.pi].go(); } else if (e.target.id === "pal") palClose(); });

/* ---------- start ---------- */
async function loadOrgs() {
  try { const r = await api("/api/orgs"); S.orgs = r.orgs || []; if (r.errors?.length) toast(t("Config errors") + ": " + r.errors[0]); } catch (e) { toast(e.message); }
  if (!orgOf()) S.org = S.orgs[0]?.id || "";
  if (!envOf()) S.env = orgOf()?.envs[0]?.env || "";
}
async function loadEnv() {
  S.runs = [];
  if (!S.org || !S.env) return;
  try { S.runs = (await api("/api/env?" + qs({ org: S.org, env: S.env }))).runs || []; } catch {}
}
(async () => {
  document.documentElement.lang = LANG;
  try { S.scans = (await api("/api/session")).scans; } catch {}
  api("/api/db").then((d) => { S.db = d; renderSide(); if (d.updating) { S.dlStart = new Date().toISOString(); pollDB(); } }).catch(() => {});
  await loadOrgs();
  await loadEnv();
  if (!S.orgs.length) S.view = "setup";
  render();
  pollJobs();
})();

</script>
</body>
