# Default check sets.
# Result for a host = default -> roles[<group role>] -> org checks -> group checks -> host checks.
# Details: docs/org-file.md (Merge order of checks)

default:
  os_packages: true
  software_fs:
    enabled: true
    # where to look for software installed outside the package manager
    paths: [/opt, /srv, /usr/local, /home]
    exclude: [/var/lib/docker, /var/lib/containerd, /proc, /sys, /dev, /run, /tmp]
    patterns:
      - "*.jar"
      - "*.war"
      - "*.ear"
      - package-lock.json
      - yarn.lock
      - pnpm-lock.yaml
      - composer.lock
      - Gemfile.lock
      - Pipfile.lock
      - poetry.lock
      - requirements*.txt
      - go.mod
      - Cargo.lock
      - "*.deps.json"
      - packages.lock.json
    max_file_mb: 100
    max_total_mb: 1024
  docker:
    enabled: false
    scan_images: false        # false | packages (recommended) | registry | save — see docs/org-file.md
    images: running           # running — only images of running containers | all — every image on the host
    image_parallel: 2         # how many images one host fetches/scans at once
    max_image_mb: 4096
  swarm: false
  mongo: false
  hardening: true
  health: true                # dmesg, journal, failed units, disks, memory, NTP
  access: true                # sshd, passwords, authorized_keys, logins for 30 days
  exposure: true              # public IPs, listening ports, firewall
  network_internal: false

roles:
  front:
    docker:
      enabled: true
  app:
    docker:
      enabled: true
  swarm_manager:
    docker:
      enabled: true
    swarm: true
  swarm_worker:
    docker:
      enabled: true
  k8s_node:
    docker:
      enabled: false
  mongo:
    mongo: true
  # internal: default only
