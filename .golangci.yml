version: "2"
linters:
  default: standard
  enable: [bodyclose, errorlint, gocritic, misspell, revive, unconvert, unparam]
  settings:
    errcheck:
      # nobody acts on these errors: closing connections, sessions and read-only files, writes to stdout/stderr,
      # removing temp files. Everything else must be checked.
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - (net.Conn).Close
        - (net.Listener).Close
        - (*golang.org/x/crypto/ssh.Client).Close
        - (*golang.org/x/crypto/ssh.Session).Close
        - (*golang.org/x/crypto/ssh.Session).Signal
        - (*golang.org/x/crypto/ssh.Client).Wait
        - (golang.org/x/crypto/ssh.Conn).Close
        - (golang.org/x/crypto/ssh.Conn).Wait
        - (*github.com/mikekosulin/kanareika/internal/report.Lock).Unlock
        - (*github.com/mikekosulin/kanareika/internal/sshx.OrgSSH).Close
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - os.Remove
        - os.RemoveAll
    staticcheck:
      checks: ["all", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022", "-QF1001"] # QF1001: De Morgan is taste
    revive:
      rules:
        - name: exported
          disabled: true   # doc comments where they explain something, not on every exported name
  exclusions:
    rules:
      - path: _test\.go      # test fixtures and fakes: unchecked errors fail the test anyway
        linters: [errcheck]
formatters:
  enable: [gofmt, goimports]
