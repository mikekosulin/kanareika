<!doctype html>
<html><head><meta charset="utf-8"><title>kanareika</title>
<style>{{.CSS}}
/* Read at ~450px wide in X and Telegram: the window comes close (flat, big type, few rows) and runs off the
   right and bottom edges; the words on the left stay large. Keep everything that matters 40px clear of the
   sides: X crops 2:1 to 1.91:1. */
html, body { width: 1280px; height: 640px; }
.aurora { inset: 0; background:
  radial-gradient(700px 420px at 1050px 60px, rgba(130,100,255,.38), transparent 70%),
  radial-gradient(560px 360px at 1180px 640px, rgba(255,190,60,.22), transparent 70%),
  radial-gradient(520px 320px at 120px 660px, rgba(60,200,190,.14), transparent 70%); }
.win { left: 520px; top: 96px; width: 820px; height: 600px; font-size: 22px; border-radius: 18px; }
.win .bar { padding: 16px 22px; font-size: 18px; }
.win .bar i { width: 14px; height: 14px; }
.win .tabs { gap: 26px; padding: 18px 22px 10px; font-size: 20px; }
.win .tabs .on { padding: 2px 10px; border-radius: 6px; }
.counts { display: flex; gap: 18px; padding: 6px 22px 18px; font-size: 20px; }
.win .row { gap: 18px; padding: 12px 22px; border-left-width: 3px; }
.win .row .p { font-size: 15px; padding: 2px 8px; border-radius: 5px; }
.win .row .h { width: 104px; }
.logo { left: 64px; top: 104px; width: 84px; height: 84px; filter: drop-shadow(0 8px 24px rgba(255,200,60,.35)); }
.name { left: 60px; top: 200px; font-size: 76px; }
.tag { left: 64px; top: 312px; width: 430px; font-size: 30px; line-height: 1.3; color: #c4c9d8; font-weight: 500; letter-spacing: -.01em; }
.sub { left: 64px; top: 520px; font-size: 18px; color: #7f879b; }
</style></head>
<body><div class="card">
<div class="abs aurora"></div>
<svg class="abs" width="1280" height="640" style="left:0;top:0"><defs><pattern id="g" width="44" height="44" patternUnits="userSpaceOnUse">
<path d="M44 0H0V44" fill="none" stroke="rgba(160,175,210,.07)"/></pattern></defs><rect width="1280" height="640" fill="url(#g)"/></svg>

<div class="abs win mono">
 <div class="bar"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i><span class="t">~ kanareika</span></div>
 <div class="tabs">{{range $i, $t := .L.Tabs}}{{if lt $i 4}}<span{{if eq $i 1}} class="on"{{end}}>{{$t}}</span>{{end}}{{end}}</div>
 <div class="counts">{{range .Counts}}<span class="c{{.N}}">■ {{.Count}} P{{.N}}</span>{{end}}</div>
 {{range $i, $r := .Rows}}{{if lt $i 5}}<div class="row{{if eq $i 0}} sel{{end}}"><span class="p p{{$r.P}}">P{{$r.P}}</span><span class="h">{{$r.Host}}</span><span class="x">{{$r.Text}}</span></div>
 {{end}}{{end}}
</div>

<img class="abs logo" src="{{.Logo}}" alt="">
<div class="abs word name">kanareika</div>
<div class="abs tag">{{.L.Tag}}<br><span class="accent">{{.L.Accent}}</span></div>
<div class="abs mono sub">{{.L.Sub}}</div>
</div></body></html>
