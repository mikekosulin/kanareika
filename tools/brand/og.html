<!doctype html>
<html><head><meta charset="utf-8"><title>kanareika</title>
<style>{{.CSS}}
html, body { width: 1280px; height: 640px; }
.win { left: 556px; top: 84px; width: 630px; height: 470px; font-size: 14px;
  transform: perspective(1400px) rotateY(-11deg) rotateX(3deg); transform-origin: left center; }
.aurora { inset: 0; background:
  radial-gradient(600px 380px at 960px 120px, rgba(130,100,255,.35), transparent 70%),
  radial-gradient(520px 340px at 1120px 560px, rgba(255,190,60,.22), transparent 70%),
  radial-gradient(500px 300px at 200px 620px, rgba(60,200,190,.14), transparent 70%); }
.logo { left: 72px; top: 118px; width: 96px; height: 96px; filter: drop-shadow(0 8px 24px rgba(255,200,60,.35)); }
.name { left: 68px; top: 230px; font-size: 72px; }
.tag { left: 72px; top: 330px; width: 460px; font-size: 24px; line-height: 1.4; color: #c4c9d8; }
.sub { left: 72px; top: 446px; font-size: 15px; color: #7f879b; }
.counts { display: flex; gap: 10px; padding: 4px 16px 14px; }
.counts .db { margin-left: auto; color: #5fd4c4; }
</style></head>
<body><div class="card">
<div class="abs aurora"></div>
<svg class="abs" width="1280" height="640" style="left:0;top:0"><defs><pattern id="g" width="44" height="44" patternUnits="userSpaceOnUse">
<path d="M44 0H0V44" fill="none" stroke="rgba(160,175,210,.07)"/></pattern></defs><rect width="1280" height="640" fill="url(#g)"/></svg>

<div class="abs win mono">
 <div class="bar"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i><span class="t">~ kanareika</span></div>
 <div class="tabs">{{range $i, $t := .L.Tabs}}<span{{if eq $i 0}} class="on"{{end}}>{{$t}}</span>{{end}}</div>
 <div class="counts">{{range .Counts}}<span class="c{{.N}}">■ {{.Count}} P{{.N}}</span>{{end}}<span class="db">● {{.L.DB}}</span></div>
 {{range $i, $r := .Rows}}<div class="row{{if eq $i 0}} sel{{end}}"><span class="p p{{$r.P}}">P{{$r.P}}</span><span class="h">{{$r.Host}}</span><span class="x">{{$r.Text}}</span><span class="k">{{$r.Kind}}</span></div>
 {{end}}
 <div class="foot"><span>{{.L.Keys}}</span><span>14:02 UTC</span></div>
</div>

<img class="abs logo" src="{{.Logo}}" alt="">
<div class="abs word name">kanareika</div>
<div class="abs tag">{{.L.Tag}}<br><span class="accent">{{.L.Accent}}</span></div>
<div class="abs mono sub">{{.L.Sub}}</div>
</div></body></html>
