# Tests on every push to main and every pull request; also called by the release workflow before building.
#   test  gofmt, go vet, go test -race (incl. the check that test data holds no real data)
#   windows  go test on Windows (the Unix-only cases skip themselves)
#   e2e   Linux end to end: the binary scans a real sshd container, then history and the web API (tools/e2e)
#   lint  golangci-lint
# Actions are pinned to full commit SHAs (the comment is the release); Dependabot keeps them current.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal assets tools)" || { gofmt -l cmd internal assets tools; echo "run gofmt"; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race -count=1 ./...

  web:
    # the page embedded into the binary (assets/web/index.html.gz) is built from web/: it must match its sources.
    # Compared unpacked: another Node's zlib may pack the same page into other bytes.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.0 (pnpm's version: packageManager in web/package.json)
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: install
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: lint and format
        working-directory: web
        run: pnpm run lint && pnpm run fmt:check
      - name: build
        working-directory: web
        run: |
          gzip -dc ../assets/web/index.html.gz > "$RUNNER_TEMP/committed.html"
          pnpm run build
      - name: up to date
        run: |
          gzip -dc assets/web/index.html.gz | cmp - "$RUNNER_TEMP/committed.html" || { echo "assets/web/index.html.gz is not built from web/: make web"; exit 1; }

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -count=1 ./...

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # the test job's -race build is the one worth caching; with the same key, this job (done first) took it
          cache: false
      - name: end to end
        run: tools/e2e/e2e.sh

  lint:
    runs-on: ubuntu-24.04
    # Without a cache (go.sum changed, a new branch) lint type-checks every dependency: ~5 min here.
    # golangci-lint has no time limit of its own; this one only stops a hung job.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
